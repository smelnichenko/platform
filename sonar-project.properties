sonar.projectKey=schnappy-platform
sonar.projectName=Schnappy Platform
sonar.sources=helm/schnappy,helm/schnappy-data,helm/schnappy-auth,helm/schnappy-observability,helm/schnappy-sonarqube,helm/schnappy-mesh,helm/schnappy-test,scylla,kafka,apt-cache,grafana
sonar.sourceEncoding=UTF-8
# Exclude Helm templates — SQ can't evaluate {{ }} expressions and reports
# false positives for resource limits, image tags, etc.
sonar.exclusions=**/templates/**/*.yaml
# The k6 smoke script runs in-cluster (grafana/k6); there is no unit runner, so
# coverage is not a meaningful gate for it. Still analysed for issues.
sonar.coverage.exclusions=**/files/*.js
# helm/schnappy-test carries a deliberate byte-identical copy of the schnappy
# chart's k6 script (charts cannot share files); CI `cmp` keeps them in sync.
sonar.cpd.exclusions=helm/schnappy-test/files/smoke-test.js
