nameOverride: schnappy

scyllaOperator:
  enabled: false

# Strict mTLS for all pod-to-pod traffic
peerAuthentication:
  enabled: true
  mode: STRICT
  # the observability stack's plaintext ports - Alertmanager's 9093 (the sidecar-less Prometheus posts alerts) and s3gw's
  # 9000 (the sidecar-less Mimir and Tempo speak S3) - where that stack runs (schnappy-infra). On unless an environment
  # without it says false (production, test): one dropped there is an inert exception, one dropped in schnappy-infra
  # would be silent alerts again (2026-04-20)
  observability: true
  # CNPG's instance manager port 8000 (the operator calls it in plaintext) - where the namespace's CNPG cluster
  # <fullname>-postgres runs with sidecars (production, test; schnappy-infra's CNPG clusters run without one)
  cnpgPostgres: true

# AuthorizationPolicies (enforced by sidecar proxy)
authorizationPolicies:
  enabled: true
  # istio.io/dry-run on the policies still proving their client lists: the sidecars count what they would refuse
  # (rbac shadow_denied), nothing is refused. Each environment turns its own off - schnappy-test first, a day of
  # Prometheus's shadow_denied increase at 0 before production
  dryRun:
    postgres: true
    strimziKafka: true

# Istio ingress gateway
gateway:
  enabled: false
  infraOnly: false
  loadBalancerIP: "192.168.11.2"
  allowedNamespaces: []
  external:
    enabled: false
    gatewayName: ""
    gatewayNamespace: ""
    hostname: ""
    hosts:
      reports: ""
  tls:
    clusterIssuer: letsencrypt-prod
  hosts:
    app: pmon.dev
    auth: auth.pmon.dev
    grafana: grafana.pmon.dev
    logs: logs.pmon.dev
    reports: reports.pmon.dev
    sonar: sonar.pmon.dev
    argocd: cd.pmon.dev
    forgejo: git.pmon.dev
    ci: ci.pmon.dev
    hubble: ""

# Route gateway.hosts.auth through the gateway to the out-of-cluster
# Keycloak (Pi Caddy VIP). Exposes only /realms/<realm> for the realms
# listed below plus /resources; /admin, /metrics, and unlisted realms
# (master included) stay LAN/VPN-only. Enablement checklist for the infra
# repo: the gateway namespace's default-deny NetworkPolicy
# (clusters/production/cluster-config/schnappy-infra-default-deny.yaml)
# should gain an explicit ipBlock egress rule to address:port — today its
# unscoped :443 "Kubernetes API" rule happens to permit the VIP, but that
# is incidental and may be tightened.
keycloakExternal:
  enabled: false
  address: ""  # required when enabled; STATIC endpoint, e.g. 192.168.11.5
  port: 443
  realms:
    - schnappy

# JWT validation on app routes only (not sonar/ci/git/auth)
jwt:
  enabled: false
  issuer: https://auth.pmon.dev/realms/schnappy
  jwksUri: https://auth.pmon.dev/realms/schnappy/protocol/openid-connect/certs
  passthroughHosts: []

# Hosts the gateway serves only to clients inside allowedCidrs (everyone else gets 403).
gatewayLanOnly:
  hosts: []
  allowedCidrs: []

# Every service's API root at the gateway. Under each: the OpenAPI document and Swagger UI answer LAN callers only
# (gateway-docs-lan-only.yaml, every service ships springdoc), and the actuator answers nobody but its health
# (gateway-actuator-deny.yaml)
apiRoots:
  - /api
  - /api/masi
  - /api/chess
  - /api/chat
  - /api/admin
