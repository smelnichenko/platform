nameOverride: schnappy

scyllaOperator:
  enabled: false

# Strict mTLS for all pod-to-pod traffic
peerAuthentication:
  enabled: true
  mode: STRICT

# AuthorizationPolicies (enforced by sidecar proxy)
authorizationPolicies:
  enabled: true

# Istio ingress gateway
gateway:
  enabled: false
  infraOnly: false
  loadBalancerIP: "192.168.11.2"
  allowedNamespaces: []
  external:
    enabled: false
    gatewayName: ""
    gatewayNamespace: ""
    hostname: ""
    hosts:
      reports: ""
  tls:
    clusterIssuer: letsencrypt-prod
  hosts:
    app: pmon.dev
    auth: auth.pmon.dev
    grafana: grafana.pmon.dev
    logs: logs.pmon.dev
    reports: reports.pmon.dev
    sonar: sonar.pmon.dev
    argocd: cd.pmon.dev
    forgejo: git.pmon.dev
    ci: ci.pmon.dev
    hubble: ""

# Route gateway.hosts.auth through the gateway to the out-of-cluster
# Keycloak (Pi Caddy VIP). Exposes only /realms/<realm> for the realms
# listed below plus /resources; /admin, /metrics, and unlisted realms
# (master included) stay LAN/VPN-only. Enablement checklist for the infra
# repo: the gateway namespace's default-deny NetworkPolicy
# (clusters/production/cluster-config/schnappy-infra-default-deny.yaml)
# should gain an explicit ipBlock egress rule to address:port — today its
# unscoped :443 "Kubernetes API" rule happens to permit the VIP, but that
# is incidental and may be tightened.
keycloakExternal:
  enabled: false
  address: ""  # required when enabled; STATIC endpoint, e.g. 192.168.11.5
  port: 443
  realms:
    - schnappy

# JWT validation on app routes only (not sonar/ci/git/auth)
jwt:
  enabled: false
  issuer: https://auth.pmon.dev/realms/schnappy
  jwksUri: https://auth.pmon.dev/realms/schnappy/protocol/openid-connect/certs
  passthroughHosts: []
