{{- if .Values.gatewayLanOnly.hosts }}
{{- $fn := include "schnappy.fullname" . }}
{{- if not .Values.gatewayLanOnly.allowedCidrs }}
{{- fail "gatewayLanOnly.allowedCidrs must list at least one range when gatewayLanOnly.hosts is set" }}
{{- end }}
# Hosts with no login of their own (Alertmanager, Prometheus, Hubble, ...) must not answer
# the internet: the router forwards public :443 to this gateway, and the Host header is the
# caller's choice, so a missing public DNS record protects nothing. Envoy sees the real
# client address (no proxy in front), so deny any source outside the allowed ranges.
# No `ports:` on purpose: the gateway has no TCP listeners, and a port that does not match the
# listener would turn this DENY into a silent no-op.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-gateway-lan-only
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ $fn }}-gateway
  action: DENY
  rules:
    - to:
        - operation:
            hosts:
              {{- range $host := .Values.gatewayLanOnly.hosts }}
              - {{ $host | quote }}
              - {{ printf "%s:*" $host | quote }}
              {{- end }}
      from:
        - source:
            notRemoteIpBlocks:
              {{- range $cidr := .Values.gatewayLanOnly.allowedCidrs }}
              - {{ $cidr | quote }}
              {{- end }}
{{- end }}
