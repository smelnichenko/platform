{{- if .Values.gateway.enabled }}
{{- $fn := include "schnappy.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fn }}-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  infrastructure:
    labels:
      gateway.istio.io/managed: istio.io-gateway-controller
    # the Service Istio makes for this Gateway, customised by it (the ConfigMap below) - its LAN address and
    # externalTrafficPolicy Cluster set where Istio makes it, never patched after (a kubectl hook did, until 2026-11-18:
    # a hook runs only when its app syncs, and bitnami/kubectl:latest is no longer published)
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $fn }}-gateway-options
  listeners:
    # Single HTTPS listener — no hostname constraint so any SNI
    # matching the wildcard cert SANs (pmon.dev, *.pmon.dev) lands
    # on the same route table. Prevents HTTP/2 connection coalescing
    # 404s when browsers reuse an idle connection across subdomains.
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: pmon-dev-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
# Istio's gateway customisation (the Gateway's infrastructure.parametersRef): its "service" key merged into the Service it
# generates. externalIPs: the LAN address (gateway.loadBalancerIP) the hosts' records point at; externalTrafficPolicy
# Cluster, not Local: with Local, Cilium stopped delivering pod -> externalIP traffic (every in-cluster probe of
# *.pmon.dev lost its connection). gatewayLanOnly relies on the gateway pods running on the node that owns this IP
# (single node today): with Cluster a second node SNATs an outside client to its own LAN address, inside allowedCidrs,
# and LanOnlyHostReachable cannot see it - revisit this before adding nodes.
# Only the keys Istio takes (deployment, service, serviceAccount, horizontalPodAutoscaler, podDisruptionBudget): one
# more, or this ConfigMap gone, and Istio stops reconciling the gateway - its log alone says so (IstioGatewayProxyBehind
# fires when its proxies then miss an Istio upgrade).
# The way back is never a revert of this file whole: Istio and the old patch Job's kubectl-patch both own externalIPs
# (2026-11-18: kubectl-patch alone before) - once that shared ownership is gone (the Service made again), a Gateway
# without this reference drops the address, and the old Job's image (bitnami/kubectl:latest) is no longer published
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-gateway-options
  namespace: {{ .Release.Namespace }}
data:
  service: |
    spec:
      externalIPs:
        - {{ .Values.gateway.loadBalancerIP | quote }}
      externalTrafficPolicy: Cluster
{{- end }}
