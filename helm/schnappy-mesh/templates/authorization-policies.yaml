{{- if .Values.authorizationPolicies.enabled }}
{{- $ns := .Release.Namespace }}
{{- $fn := include "schnappy.fullname" . }}
---
# CloudNativePG's PostgreSQL instances, selected by cluster: CNPG labels its pods cnpg.io/cluster (and
# app.kubernetes.io/component=database - never the "postgres" this selected until 2026-11-18, when it held no pod and
# 5432 had no identity check, the NetworkPolicy alone). 5432: the app services, the instances themselves (a replica
# streams from the primary through both sidecars) and the init-users Job. 8000: the instance manager's status port,
# called in plaintext with no identity - by the CNPG operator (cnpg-system, no sidecar) and by the primary's liveness
# isolation check, which pings its peers' 8000 every probe (every 10 s; it decides the primary's restart when the API
# server is unreachable) - so any source, the cnpg-postgres PeerAuthentication making it PERMISSIVE and the
# NetworkPolicy keeping it to cnpg-system and the instances. Narrowing it to principals would restart a primary in an API
# server outage. Metrics leave through 15020 (merged), which the sidecar does not capture.
# Applying this policy, and enforcing it, are each a filter-chain update of every instance's inbound listener: Envoy
# drains the old chains and closes their connections after its drain time (45 s) - every pooled connection and the
# replica's WAL receiver reconnect once, a statement in flight fails. From that reconnect on the policy decides (dry
# run: the instance sidecars' rbac shadow_denied counts what it would refuse). Dry run per environment
# (authorizationPolicies.dryRun.postgres): schnappy-test enforced first, production after.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-postgres
  namespace: {{ $ns }}
  {{- if .Values.authorizationPolicies.dryRun.postgres }}
  annotations:
    istio.io/dry-run: "true"
  {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ $fn }}-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-monitor
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-admin
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chat
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chess
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-masi
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-postgres
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-postgres-init-users
      to:
        - operation:
            ports: ["5432"]
    - to:
        - operation:
            ports: ["8000"]
---
# Valkey — only app services on port 6379
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-valkey
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: valkey
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-monitor
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-admin
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chat
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chess
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-centrifugo
      to:
        - operation:
            ports: ["6379"]
---
# OpenSearch — masi alone, on its API (9200)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-opensearch
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: opensearch
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-masi
      to:
        - operation:
            ports: ["9200"]
---
# Strimzi's Kafka brokers - the services that use Kafka, the broker's own identity (its tools reach the bootstrap Service
# through its sidecar: the copy's data check, the restore check) and Kafka's backup Job (schnappy-data's kafka-backup.yaml),
# on the clients' listener 9092 alone (9090/9091/9093/8443 bypass the sidecar). Until it, any workload in the mesh
# reached Kafka (2026-11-18). Selected by cluster and role, not strimzi.io/name: that is <cluster>-<node pool>, and a pool
# renamed or split would have left the brokers with no policy. A SCRAM listener (schnappy-data's kafka.scram.enabled:
# 9094) would need its port here; ClickHouse's events consumer (schnappy-observability's clickhouse.events, off) its
# principal. DRY RUN first (authorizationPolicies.dryRun.strimziKafka, per environment): applying it drained the
# broker's connections once (its clients reconnected at 04:32 today), and from that reconnect the broker sidecar's rbac
# shadow_denied counts what it would refuse; enforced - schnappy-test first - once a day's traffic, the 02:30 backup
# among it, shows none (Prometheus's increase over 24 h: a pod's own counters restart with it).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-strimzi-kafka
  namespace: {{ $ns }}
  {{- if .Values.authorizationPolicies.dryRun.strimziKafka }}
  annotations:
    istio.io/dry-run: "true"
  {{- end }}
spec:
  selector:
    matchLabels:
      strimzi.io/cluster: {{ $fn }}
      strimzi.io/broker-role: "true"
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-monitor
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-admin
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chat
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chess
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-centrifugo
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-kafka
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-masi
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-kafka-backup
      to:
        - operation:
            ports: ["9092"]
---
# s3gw (versitygw) intentionally has NO L7 AuthorizationPolicy on :9000.
# Its S3 clients (the buckets Job, and Mimir/Tempo/Hyperfoil on the infra tier)
# must run sidecar-less — istio breaks S3 SigV4 — so they carry no principal to
# match at L7. Access to :9000 is gated by the NetworkPolicy (pod-label selectors).
---
# Centrifugo — gateway + browser WS clients arrive via the Istio
# ingress; app services may publish via the HTTP API. Trust the Istio
# gateway SA, the four app service SAs, and the schnappy-infra
# Prometheus SA (scrapes /metrics on the same port).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-centrifugo
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: centrifugo
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-monitor
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-admin
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chat
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-chess
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-centrifugo
              # Prometheus operator-managed CR runs in schnappy-infra
              # and scrapes /metrics on the same http port.
              - cluster.local/ns/schnappy-infra/sa/schnappy-prometheus
        # Browser → Istio ingress gateway is the public path.
        # Trust-inside-mesh via the gateway's namespace/SA.
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            ports: ["8000"]
---
# /api/internal/** is admin-only on chat. Spring Security permits the
# path so the cluster principal (mTLS source SA) is the authority;
# this DENY rule rejects every source other than the admin service.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-chat-internal
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: chat
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-admin
      to:
        - operation:
            paths: ["/api/internal/*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-chess-internal
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: chess
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-admin
      to:
        - operation:
            paths: ["/api/internal/*"]
{{- /*
  App HTTP :8080 — restrict ingress to the gateway, Prometheus, Hyperfoil, and
  the specific legit in-mesh service callers. ENFORCING since 2026-06-22: the
  caller list was validated against ~a day of prod traffic in dry-run — every
  actual caller carried an allow-listed mTLS principal and all four apps showed
  zero shadow_denied — before the dry-run annotation was removed. Defense in
  depth on top of the in-app JWT validation, which already rejects forged
  tokens. (Prometheus scrapes via the sidecar :15020 merge, not :8080, so it is
  unaffected.)
*/}}
{{- $httpCallers := dict "monitor" (list) "admin" (list "monitor" "chat" "chess" "masi") "chat" (list "admin") "chess" (list "admin") "masi" (list) }}
---
# masi-browser :3000 — ONLY masi's principal. Not in $httpCallers on purpose: that template
# admits the ingress gateway and Hyperfoil, neither of which may drive the browser.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-masi-browser-http
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: masi-browser
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-masi
      to:
        - operation:
            ports: ["3000"]
{{- range $svc, $callers := $httpCallers }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $fn }}-{{ $svc }}-http
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $svc }}
  action: ALLOW
  rules:
    # North-south: the Istio ingress gateway (schnappy-infra)
    - from:
        - source:
            principals:
              - cluster.local/ns/schnappy-infra/sa/schnappy-infra-gateway-istio
    # Prometheus scrape of /actuator/prometheus on :8080
    - from:
        - source:
            principals:
              - cluster.local/ns/schnappy-infra/sa/schnappy-prometheus
    # Hyperfoil load/stress agents (no-op when hyperfoil is not deployed)
    - from:
        - source:
            principals:
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-hyperfoil
    {{- if $callers }}
    # In-mesh service callers
    - from:
        - source:
            principals:
              {{- range $callers }}
              - cluster.local/ns/{{ $ns }}/sa/{{ $fn }}-{{ . }}
              {{- end }}
    {{- end }}
{{- end }}
{{- end }}
