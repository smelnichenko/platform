    {{- range .Values.games }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ .name }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/name: {{ include "schnappy.name" $ }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- end }}
