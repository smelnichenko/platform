{{- if and .Values.prometheus.enabled .Values.alerts.enabled }}
{{- $fn := include "schnappy.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- /* masi-browser stays out: its /metrics is JSON, not an exposition */ -}}
{{- $jobRegex := "schnappy-(monitor|admin|chat|chess|masi|game-scp|site)" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fn }}-app-alerts
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
spec:
  groups:
    - name: {{ $ns }}-infrastructure
      rules:
        - alert: PodRestartingFrequently
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}"}[1h]) > 3
            unless on(pod, namespace) kube_pod_owner{namespace="{{ $ns }}", owner_kind="Job"}
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/PodRestartingFrequently"
            summary: "Pod {{"{{"}} $labels.pod {{"}}"}} restarting frequently"
        - alert: ContainerOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{namespace="{{ $ns }}", reason="OOMKilled"} == 1
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/ContainerOOMKilled"
            summary: "Container {{"{{"}} $labels.container {{"}}"}} in {{"{{"}} $labels.pod {{"}}"}} was OOM killed"
        - alert: PodCrashLoopBackOff
          expr: kube_pod_container_status_waiting_reason{namespace="{{ $ns }}", reason="CrashLoopBackOff"} == 1
          for: 5m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/PodCrashLoopBackOff"
            summary: "Pod {{"{{"}} $labels.pod {{"}}"}} in CrashLoopBackOff"
        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{namespace="{{ $ns }}", condition="true"} == 0
            unless on(pod, namespace) kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1
            unless on(pod, namespace) kube_pod_owner{namespace="{{ $ns }}", owner_kind="Job"}
          for: 10m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/PodNotReady"
            summary: "Pod {{"{{"}} $labels.pod {{"}}"}} not ready"

    - name: {{ $ns }}-application
      rules:
        - alert: AppDown
          expr: up{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"} == 0
          for: 2m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/AppDown"
            summary: "App {{"{{"}} $labels.instance {{"}}"}} is down"
        - alert: HighHTTPErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job=~"{{ $jobRegex }}", namespace="{{ $ns }}", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/HighHTTPErrorRate"
            summary: "High HTTP 5xx error rate ({{"{{"}} $value | humanizePercentage {{"}}"}})"
        - alert: HighRequestLatency
          expr: http_server_requests_seconds_max{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"} > 5
          for: 10m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/HighRequestLatency"
            summary: "High request latency (max > 5s)"
        - alert: HikariPoolExhausted
          expr: hikaricp_connections_active{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"} / hikaricp_connections_max{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"} > 0.8
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/HikariPoolExhausted"
            summary: "HikariCP connection pool nearly exhausted"
        - alert: JVMHeapHigh
          expr: jvm_memory_used_bytes{job=~"{{ $jobRegex }}", namespace="{{ $ns }}", area="heap"} / jvm_memory_max_bytes{job=~"{{ $jobRegex }}", namespace="{{ $ns }}", area="heap"} > 0.85
          for: 10m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/JVMHeapHigh"
            summary: "JVM heap usage high"
        - alert: JvmMemoryHigh
          expr: |
            sum(jvm_memory_used_bytes{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"})
            / sum(jvm_memory_max_bytes{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"})
            > 0.85
          for: 10m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/JvmMemoryHigh"
            summary: "JVM memory usage high ({{"{{"}} $value | humanizePercentage {{"}}"}})"
        - alert: ProcessCPUHigh
          expr: process_cpu_usage{job=~"{{ $jobRegex }}", namespace="{{ $ns }}"} > 0.9
          for: 15m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/ProcessCPUHigh"
            summary: "Process CPU usage high"

{{- if eq (.Values.masiService.enabled | toString) "true" }}
    # masi: the LLM ledger and budgets, source health, the browser pod. The ratios are
    # computed by the app, so each has an absent() cover: a silent gauge is itself a
    # finding, not a green board. Unit tests: helm/schnappy/tests/rules/masi-alerts.test.yaml.
    - name: {{ $ns }}-masi
      rules:
        - alert: MasiBudgetDay
          expr: masi_llm_budget_used_ratio{job="schnappy-masi", namespace="{{ $ns }}", period="day"} > 0.8
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiBudgetDay"
            summary: "masi has spent {{"{{"}} $value | humanizePercentage {{"}}"}} of today's LLM budget"
        - alert: MasiBudgetMonth
          expr: masi_llm_budget_used_ratio{job="schnappy-masi", namespace="{{ $ns }}", period="month"} > 0.9
          for: 5m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiBudgetMonth"
            summary: "masi has spent {{"{{"}} $value | humanizePercentage {{"}}"}} of this month's LLM budget"
        - alert: MasiBudgetGaugeAbsent
          expr: |
            absent(masi_llm_budget_used_ratio{job="schnappy-masi", namespace="{{ $ns }}", period="day"})
            and on() (up{job="schnappy-masi", namespace="{{ $ns }}"} == 1)
          for: 30m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiBudgetGaugeAbsent"
            summary: "masi is up but reports no budget ratio: the budget alerts are blind"
        - alert: MasiCostRate
          expr: sum(rate(masi_llm_cost_usd_total{job="schnappy-masi", namespace="{{ $ns }}"}[1h])) * 3600 > {{ .Values.masiService.alerts.costRateUsdPerHour }}
          for: 10m
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiCostRate"
            summary: "masi is spending {{"{{"}} $value | printf \"%.2f\" {{"}}"}} USD per hour on LLM calls"
        - alert: MasiLedgerFailures
          expr: increase(masi_llm_ledger_failures_total{job="schnappy-masi", namespace="{{ $ns }}"}[15m]) > 0
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiLedgerFailures"
            summary: "masi could not write its LLM ledger: spend may be escaping the budget"
        - alert: MasiModelMismatch
          expr: increase(masi_llm_model_mismatch_total{job="schnappy-masi", namespace="{{ $ns }}"}[1h]) > 0
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiModelMismatch"
            summary: "the API answered with a model other than the one masi priced ({{"{{"}} $labels.configured {{"}}"}} → {{"{{"}} $labels.returned {{"}}"}})"
        - alert: MasiSourceDisabledAuto
          # SourceHealth ordinal: OK 0, DEGRADED 1, FAILING 2, DISABLED_AUTO 3
          expr: masi_source_health{job="schnappy-masi", namespace="{{ $ns }}"} == 3
          for: 5m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiSourceDisabledAuto"
            summary: "source {{"{{"}} $labels.source {{"}}"}} was disabled after ten consecutive failures"
        - alert: MasiSourceStale
          # an enabled source whose last success is older than three of its own intervals
          expr: |
            (time() - masi_source_last_success_timestamp_seconds{job="schnappy-masi", namespace="{{ $ns }}"})
            > on(source, job, namespace) (3 * masi_source_interval_seconds{job="schnappy-masi", namespace="{{ $ns }}"})
          for: 15m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiSourceStale"
            summary: "source {{"{{"}} $labels.source {{"}}"}} has had no successful run for three intervals"
        - alert: MasiSourceHostNotAllowed
          # the allow-list is masiService.http.allowedHosts here; the hosts a source contacts come from its row, from
          # defaults in its collector, from links on its list page and from redirects. The gauge counts the distinct
          # hosts the source's LAST run tried and was refused, wherever the URL came from.
          expr: |
            masi_source_refused_hosts{job="schnappy-masi", namespace="{{ $ns }}"} > 0
          for: 15m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiSourceHostNotAllowed"
            summary: "the last run of source {{"{{"}} $labels.source {{"}}"}} was refused {{"{{"}} $value {{"}}"}} host(s) that masiService.http.allowedHosts does not list"
        - alert: MasiSourceNotClosing
          # a run counts misses (and so can close listings) only when it is complete AND stored everything it saw.
          # A source that is incomplete every time, or has one listing it can never store, succeeds for ever and
          # closes nothing: last-success moves, this does not.
          expr: |
            (
              (time() - masi_source_last_misses_counted_timestamp_seconds{job="schnappy-masi", namespace="{{ $ns }}"})
              > on(source, job, namespace) (3 * masi_source_interval_seconds{job="schnappy-masi", namespace="{{ $ns }}"})
            )
            # a source that is not succeeding at all is MasiSourceStale's; this one is for the run that succeeds and closes nothing
            unless on(source, job, namespace) (
              (time() - masi_source_last_success_timestamp_seconds{job="schnappy-masi", namespace="{{ $ns }}"})
              > on(source, job, namespace) (3 * masi_source_interval_seconds{job="schnappy-masi", namespace="{{ $ns }}"})
            )
          for: 15m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiSourceNotClosing"
            summary: "source {{"{{"}} $labels.source {{"}}"}} has counted no misses for three intervals: none of its listings can close"
        - alert: MasiSweepStarved
          # the sweep that closes listings past their deadline stands aside while an ingest writes (one lock guards
          # listing and job state). Twelve sweeps fit in two hours: ten skipped means it practically never runs
          expr: |
            sum by (job, namespace, sweep) (increase(masi_sweep_skipped_total{job="schnappy-masi", namespace="{{ $ns }}", reason="ingest_busy"}[2h])) >= 10
          for: 10m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiSweepStarved"
            summary: "masi's {{"{{"}} $labels.sweep {{"}}"}} sweep was skipped {{"{{"}} $value | printf \"%.0f\" {{"}}"}} times in two hours: an ingest holds the lock almost all the time"
        - alert: MasiReportsStale
          # the weekly snapshot is written Monday 06:00 and caught up on every cron and restart;
          # nine days without one means the generator itself is failing, which nothing else shows
          expr: |
            (time() - masi_report_period_end_timestamp_seconds{job="schnappy-masi", namespace="{{ $ns }}", kind="WEEKLY"}) > 9 * 86400
          for: 1h
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiReportsStale"
            summary: "masi has not written a weekly report for over nine days"
        - alert: MasiBrowserUnreachable
          expr: masi_browser_reachable{job="schnappy-masi", namespace="{{ $ns }}"} == 0
          for: 10m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiBrowserUnreachable"
            summary: "masi cannot reach its browser pod; browser sources are being skipped"
        - alert: MasiBrowserSaturated
          expr: masi_browser_sessions_active{job="schnappy-masi", namespace="{{ $ns }}"} >= {{ .Values.masiService.browser.maxParallel }}
          for: 15m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/MasiBrowserSaturated"
            summary: "every browser session slot has been busy for 15 minutes"
{{- end }}

    - name: {{ $ns }}-smoke-tests
      rules:
        # k6 pushes to Mimir, not to this Prometheus: these series arrive through
        # Prometheus' remoteRead, which only serves queries carrying source="k6"
        # (both labels come from the Job's `--tag`). The metric is k6_checks_rate
        # (k6's prometheus-rw naming). last_over_time: a run's sample is a point,
        # not a series — an instant `< 1` would only be visible for 5 minutes.
        - alert: K6SmokeTestFailing
          expr: last_over_time(k6_checks_rate{namespace="{{ $ns }}", source="k6"}[1d]) < 1
          labels:
            severity: critical
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/K6SmokeTestFailing"
            summary: "k6 smoke test check failing ({{"{{"}} $labels.check {{"}}"}})"
        # k6 exits 0 when its remote-write push fails, so a dropped push (a
        # NetworkPolicy, Mimir down) leaves the hook green and the dashboard
        # and the rule above blind. Gated on the hook Job having completed in
        # the last day (kube-state-metrics), so a quiet month without a deploy
        # does not fire; a completed run with no sample behind it does.
        - alert: K6SmokeMetricsMissing
          expr: >-
            absent_over_time(k6_checks_rate{namespace="{{ $ns }}", source="k6"}[1d])
            and on() (time() - max(kube_job_status_completion_time{namespace="{{ $ns }}", job_name=~".*-k6-smoke"}) < 86400)
          for: 1h
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/K6SmokeMetricsMissing"
            summary: "k6 smoke ran in {{ $ns }} but no metrics arrived"
            description: "A k6 smoke hook Job completed in namespace {{ $ns }} within the last day, but Mimir holds no k6_checks_rate sample for it: the push to Mimir is failing (k6 still exits 0)."

    - name: {{ $ns }}-keycloak-sync
      rules:
        # admin pushes role/enabled changes to Keycloak; failures were silent
        # (log-only) before these counters existed. The hourly reconcile is the
        # self-heal, these alerts are the visibility.
        - alert: KeycloakSyncFailing
          expr: increase(admin_keycloak_sync_failures_total{namespace="{{ $ns }}"}[1h]) > 0
          for: 30m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/KeycloakSyncFailing"
            summary: "Keycloak role sync failing ({{"{{"}} $labels.operation {{"}}"}})"
            description: "admin failed to push role/enabled changes to Keycloak in the last hour — KC permissions may be drifting from the admin DB. The hourly reconcile retries; persistent failure points at the KC Admin API or a specific user."
        - alert: KeycloakReconcileStale
          expr: time() - max(admin_keycloak_reconcile_last_success{namespace="{{ $ns }}"}) > 3 * 3600
          for: 20m
          labels:
            severity: warning
            namespace: {{ $ns }}
          annotations:
            runbook_url: "https://runbooks.pmon.dev/KeycloakReconcileStale"
            summary: "Keycloak role reconcile has not succeeded in 3h"
            description: "The hourly admin->Keycloak reconcile (self-heal for role/offboarding drift) has not completed for over 3h, or has never succeeded. Check the admin pod and the KC Admin API; drift from silently-failed live syncs won't be corrected until it runs."
{{- end }}
