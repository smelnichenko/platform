{{- if .Values.vault.secretsEnabled }}
{{- if or (eq (.Values.mail.enabled | toString) "true") (eq (.Values.masiService.mail.enabled | toString) "true") }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.mail.secretName" . }}
  labels:
    {{- include "schnappy.monitor.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.mail.secretName" . }}
  data:
    - secretKey: MAIL_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/mail
        property: password
{{- end }}
{{- if or .Values.ai.apiKey .Values.ai.existingSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.ai.secretName" . }}
  labels:
    {{- include "schnappy.monitor.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.ai.secretName" . }}
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/ai
        property: api_key
{{- end }}
{{- if and (eq (.Values.masiService.enabled | toString) "true") .Values.masiService.ai.existingSecret }}
---
# masi's own Anthropic key: revocable and accountable separately from the shared `ai` key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.masiService.ai.existingSecret }}
  labels:
    {{- include "schnappy.masi.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.masiService.ai.existingSecret }}
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/ai-masi
        property: api_key
{{- end }}
{{- if and (eq (.Values.masiService.enabled | toString) "true") .Values.masiService.credentials.existingSecret }}
---
# the operator's credentials masi uses - never values in git (a Gmail app password and the LinkedIn cookie were, 10-23)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.masiService.credentials.existingSecret }}
  labels:
    {{- include "schnappy.masi.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.masiService.credentials.existingSecret }}
  # every property of the path, so a key not seeded is simply absent (the deployment's refs are optional)
  dataFrom:
    - extract:
        key: {{ .Values.vault.secretPathPrefix }}/masi-credentials
{{- end }}
{{- if and (eq (.Values.masiService.enabled | toString) "true") (eq (.Values.masiService.browser.enabled | toString) "true") .Values.masiService.browser.existingSecret }}
---
# browserless TOKEN, shared by the browser pod and masi only (Vault <prefix>/masi-browser).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.masiService.browser.existingSecret }}
  labels:
    {{- include "schnappy.masiBrowser.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.masiService.browser.existingSecret }}
  data:
    - secretKey: TOKEN
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/masi-browser
        property: token
{{- end }}
{{- if eq (.Values.webhook.enabled | toString) "true" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.webhook.secretName" . }}
  labels:
    {{- include "schnappy.monitor.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.webhook.secretName" . }}
  data:
    - secretKey: RESEND_WEBHOOK_SECRET
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/webhook
        property: signing_secret
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/webhook
        property: api_key
{{- end }}
{{- end }}
