{{- if eq (.Values.masiService.enabled | toString) "true" -}}
{{- if and (eq (.Values.masiService.apply.enabled | toString) "true") (ne (.Values.masiService.mail.enabled | toString) "true") }}
{{- fail "masiService.apply.enabled needs masiService.mail.enabled: a send goes through masi's mail server" }}
{{- end }}
{{- if and (eq (.Values.masiService.apply.enabled | toString) "true") (ne (.Values.masiService.apply.production | toString) "true") (not .Values.masiService.mail.deliverAllTo) }}
{{- fail "masiService.apply.enabled outside production needs masiService.mail.deliverAllTo (the sink); production sets masiService.apply.production" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "schnappy.masi.serviceName" . }}
  labels:
    {{- include "schnappy.masi.labels" . | nindent 4 }}
spec:
  # N equal pods (plan 099): each scheduled run is claimed once per slot in the database, every writer meets at the
  # rows and identities it writes, and a Send is claimed once per package - any number of replicas is safe.
  replicas: {{ .Values.masiService.replicas }}
  # Single node: recreate in place (maxSurge 0) so a roll never deadlocks on
  # CPU-request headroom. A brief blip per deploy is the accepted trade-off.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "schnappy.masi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "schnappy.masi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: schnappy
      annotations:
        prometheus.io/scrape: "true"
        # context-path is /api/masi (chess's /api layout would route the actuator to monitor)
        prometheus.io/path: "/api/masi/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "schnappy.fullname" . }}-masi
      # the tuning lane drains for up to 40 s on SIGTERM so a running Opus call settles its ledger row and its package
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: forgejo-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: masi
          image: "{{ .Values.masiService.image.repository }}:{{ .Values.masiService.image.tag }}"
          imagePullPolicy: {{ .Values.masiService.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            # PDF scratch (PDFBox) and the Playwright driver unpack (java.io.tmpdir) live here.
            - name: tmp
              mountPath: /tmp
          env:
            # In-app JWT validation (defense in depth on top of the gateway):
            # GatewayAuthFilter verifies the Keycloak signature against JWKS.
            - name: KEYCLOAK_ISSUER
              value: "https://{{ .Values.keycloak.hostname }}/realms/schnappy"
            - name: KEYCLOAK_JWKS_URI
              value: "https://{{ .Values.keycloak.hostname }}/realms/schnappy/protocol/openid-connect/certs"
            # Token-relay target for user provisioning (POST /api/auth/ensure-user).
            - name: ADMIN_SERVICE_URL
              value: "http://{{ include "schnappy.admin.serviceName" . }}:8080"
            - name: JAVA_OPTS
              value: {{ .Values.masiService.javaOpts | default "-Xmx768m" | quote }}
            - name: MASI_ENABLED
              value: "true"
            # the OpenAPI document and Swagger UI: served only where this says so (test); the gateway keeps them LAN-only besides
            - name: MASI_API_DOCS_ENABLED
              value: {{ .Values.masiService.apiDocs.enabled | toString | quote }}
            - name: DB_HOST
              value: {{ include "schnappy.postgres.serviceName" . }}
            - name: SPRING_DATASOURCE_HIKARI_DATA-SOURCE-PROPERTIES
              value: "sslmode=require"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" . }}-postgres-masi
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" . }}-postgres-masi
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" . }}-postgres-masi
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "schnappy.kafka.serviceName" . }}:9092"
            {{- if and (eq (.Values.masiService.ai.enabled | toString) "true") .Values.masiService.ai.existingSecret }}
            # masi's OWN Anthropic key (Vault <prefix>/ai-masi), never the shared `ai` key.
            - name: AI_ENABLED
              value: "true"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masiService.ai.existingSecret }}
                  key: ANTHROPIC_API_KEY
            # Per-service model choice: never the chart-level AI_MODEL (Haiku in test values).
            - name: MASI_AI_TUNING_MODEL
              value: {{ .Values.masiService.ai.tuningModel | quote }}
            - name: MASI_AI_EXTRACT_MODEL
              value: {{ .Values.masiService.ai.extractModel | quote }}
            - name: MASI_AI_MATCH_MODEL
              value: {{ .Values.masiService.ai.matchModel | quote }}
            - name: AI_DAILY_BUDGET_USD
              value: {{ .Values.masiService.ai.dailyBudgetUsd | quote }}
            - name: AI_MONTHLY_BUDGET_USD
              value: {{ .Values.masiService.ai.monthlyBudgetUsd | quote }}
            - name: MASI_AI_IN_FLIGHT
              value: {{ .Values.masiService.ai.inFlight | quote }}
            {{- else }}
            - name: AI_ENABLED
              value: "false"
            {{- end }}
            - name: MASI_TUNING_AUTO
              value: {{ .Values.masiService.tuning.auto | toString | quote }}
            # open jobs analysed by the cheap model ahead of any request, so they can be ranked; spends under the SCORE share
            - name: MASI_ANALYSIS_AUTO
              value: {{ .Values.masiService.analysis.auto | toString | quote }}
            - name: MASI_ANALYSIS_PER_TICK
              value: {{ .Values.masiService.analysis.perTick | quote }}
            # then the AI match of analysed jobs against the active masters, under the MATCH share
            - name: MASI_MATCH_AUTO
              value: {{ .Values.masiService.analysis.matchAuto | toString | quote }}
            - name: MASI_MATCH_PER_TICK
              value: {{ .Values.masiService.analysis.matchPerTick | quote }}
            # the background visits to hiring companies' own sites (the open fetcher: public HTTPS, robots.txt honoured)
            - name: MASI_ENRICH_ENABLED
              value: {{ .Values.masiService.enrich.enabled | toString | quote }}
            - name: MASI_ENRICH_PER_TICK
              value: {{ .Values.masiService.enrich.perTick | quote }}
            # the background collection of contacts' pictures (Gravatar, unavatar.io, the company's own site)
            - name: MASI_ENRICH_CONTACT_PICTURES_ENABLED
              value: {{ .Values.masiService.enrich.contactPictures.enabled | toString | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_PER_TICK
              value: {{ .Values.masiService.enrich.contactPictures.perTick | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_TICK
              value: {{ .Values.masiService.enrich.contactPictures.tick | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_INITIAL_DELAY
              value: {{ .Values.masiService.enrich.contactPictures.initialDelay | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_REVISIT
              value: {{ .Values.masiService.enrich.contactPictures.revisit | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_GRAVATAR
              value: {{ .Values.masiService.enrich.contactPictures.gravatar | toString | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_UNAVATAR
              value: {{ .Values.masiService.enrich.contactPictures.unavatar | toString | quote }}
            - name: MASI_ENRICH_CONTACT_PICTURES_COMPANY_SITE
              value: {{ .Values.masiService.enrich.contactPictures.companySite | toString | quote }}
            {{- if eq (.Values.masiService.mail.enabled | toString) "true" }}
            # the weekly digest by mail. SPRING_MAIL_HOST is what makes a mail sender exist at all: set only here
            - name: MASI_MAIL_ENABLED
              value: "true"
            # unattended mail is opt-in: off, a digest leaves only when somebody asks for it ("mail me this report")
            - name: MASI_MAIL_WEEKLY_AUTO
              value: {{ .Values.masiService.mail.weeklyAuto | default false | toString | quote }}
            {{- if .Values.masiService.mail.deliverAllTo }}
            # a NON-production environment's mail sink: every digest goes here, none to a reader's own address
            - name: MASI_MAIL_DELIVER_ALL_TO
              value: {{ .Values.masiService.mail.deliverAllTo | quote }}
            {{- end }}
            - name: MASI_SITE_URL
              value: {{ required "masiService.mail.siteUrl is required when masiService.mail.enabled" .Values.masiService.mail.siteUrl | quote }}
            {{- if eq (.Values.masiService.apply.enabled | toString) "true" }}
            # sending an application on the operator's click: one mail per press, never on a schedule
            - name: MASI_APPLY_ENABLED
              value: "true"
            - name: MASI_APPLY_FROM
              value: {{ required "masiService.apply.from is required when masiService.apply.enabled" .Values.masiService.apply.from | quote }}
            - name: MASI_APPLY_REPLY_TO
              value: {{ required "masiService.apply.replyTo is required when masiService.apply.enabled" .Values.masiService.apply.replyTo | quote }}
            - name: MASI_APPLY_BCC
              value: {{ required "masiService.apply.bcc is required when masiService.apply.enabled" .Values.masiService.apply.bcc | quote }}
            - name: MASI_APPLY_PRODUCTION
              value: {{ .Values.masiService.apply.production | default false | toString | quote }}
            {{- end }}
            - name: MAIL_FROM
              value: {{ .Values.mail.fromAddress | default "noreply@example.com" | quote }}
            - name: SPRING_MAIL_HOST
              value: {{ .Values.mail.host | default "smtp.resend.com" | quote }}
            - name: SPRING_MAIL_PORT
              value: {{ .Values.mail.port | default "587" | quote }}
            - name: SPRING_MAIL_USERNAME
              value: {{ .Values.mail.username | default "resend" | quote }}
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.mail.secretName" . }}
                  key: MAIL_PASSWORD
            {{- end }}
            # the only hosts the collectors may contact, in the fetcher and in the browser; empty = none
            - name: MASI_HTTP_ALLOWED_HOSTS
              value: {{ join "," .Values.masiService.http.allowedHosts | quote }}
            {{- if eq (.Values.masiService.browser.enabled | toString) "true" }}
            - name: MASI_BROWSER_ENABLED
              value: "true"
            # CDP over the Service port named `http`: the websocket upgrades through Envoy.
            - name: MASI_BROWSER_ENDPOINT
              value: "ws://{{ include "schnappy.masiBrowser.serviceName" . }}:3000"
            - name: MASI_BROWSER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masiService.browser.existingSecret }}
                  key: TOKEN
            # the browser's sessions are shared by every masi pod: each takes its share (at least one), or two pods each
            # starting maxParallel sessions overrun the browser's CONCURRENT and get 429s
            - name: MASI_BROWSER_MAX_PARALLEL
              value: {{ max 1 (div (int .Values.masiService.browser.maxParallel) (int .Values.masiService.replicas)) | quote }}
            - name: MASI_BROWSER_RUN_DEADLINE_MS
              value: {{ .Values.masiService.browser.timeoutMs | quote }}
            {{- else }}
            - name: MASI_BROWSER_ENABLED
              value: "false"
            {{- end }}
            # The masi image never contains a browser; Playwright must not try to fetch one.
            - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
              value: "1"
            {{- if eq (.Values.tracing.enabled | toString) "true" }}
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: {{ .Values.tracing.samplingProbability | default "0.1" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ .Values.tracing.tempoEndpoint | default "http://schnappy-tempo.schnappy-infra.svc:4317" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT
              value: {{ .Values.tracing.tempoTransport | default "grpc" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TIMEOUT
              value: {{ .Values.tracing.exporterTimeout | default "30s" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_CONNECT_TIMEOUT
              value: {{ .Values.tracing.exporterConnectTimeout | default "30s" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_SCHEDULE_DELAY
              value: {{ .Values.tracing.scheduleDelay | default "1s" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_MAX_QUEUE_SIZE
              value: {{ .Values.tracing.maxQueueSize | default "8192" | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_MAX_BATCH_SIZE
              value: {{ .Values.tracing.maxBatchSize | default "2048" | quote }}
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,prometheus,env,configprops"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "false"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS
              value: "true"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_MINIMUMEXPECTEDVALUE_HTTP_SERVER_REQUESTS
              value: "1ms"
            - name: MANAGEMENT_METRICS_DISTRIBUTION_MAXIMUMEXPECTEDVALUE_HTTP_SERVER_REQUESTS
              value: "10s"
            - name: SPRING_APPLICATION_NAME
              value: masi
            {{- end }}
          resources:
            {{- toYaml .Values.masiService.resources | nindent 12 }}
          # Startup budget: failureThreshold × 10 s (10 minutes by default). Until startupProbe
          # succeeds, kubelet holds off on liveness/readiness, so a slow Spring Boot boot
          # (Liquibase, DB, Kafka, the startup repairs) on a busy node is not killed mid-start —
          # 2026-09-28 a start took 279 s and the old 5-minute budget killed it once.
          startupProbe:
            httpGet:
              path: /api/masi/actuator/health/liveness
              port: 8080
            failureThreshold: {{ dig "startupProbe" "failureThreshold" 60 .Values.masiService }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/masi/actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/masi/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
{{- if gt (int .Values.masiService.replicas) 1 }}
---
# with more than one pod, a voluntary eviction (a node drain, an upgrade) keeps one serving: every pod runs the same
# lanes, so one is enough to carry on
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "schnappy.masi.serviceName" . }}
  labels:
    {{- include "schnappy.masi.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "schnappy.masi.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
