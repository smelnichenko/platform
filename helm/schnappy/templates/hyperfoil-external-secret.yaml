{{- if and (eq (.Values.hyperfoil.enabled | toString) "true") .Values.vault.secretsEnabled .Values.hyperfoil.clientSecretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.hyperfoil.clientSecretName }}
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
  annotations:
    # spec.data list-additions don't apply in-place under Argo's CSA 3-way merge
    # (an S3-key add had to be hand-patched once); Replace=true makes Argo
    # delete+recreate this ExternalSecret. deletionPolicy Retain keeps the secret
    # + its data through the swap, so consumers never lose creds.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.hyperfoil.clientSecretName }}
  data:
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/k6-smoke
        property: client_secret
    # S3 creds for uploading load-test reports to the infra s3gw (versitygw).
    # Same Vault path as the in-cluster S3 root key, so hyperfoil authenticates
    # as the s3gw root (single source of truth — no credential split-brain).
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/minio
        property: access_key
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/minio
        property: secret_key
{{- end }}
