{{- if and .Values.previewMode .Values.previewNumber -}}
# Pre-delete hook that prunes per-PR shared resources that the chart
# created prefixes for but doesn't own the lifecycle of (Kafka topics
# on the shared cluster, Scylla keyspaces, Keycloak client).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "schnappy.fullname" . }}-preview-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "schnappy.fullname" . }}-preview-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkatopics"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "schnappy.fullname" . }}-preview-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ include "schnappy.fullname" . }}-preview-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "schnappy.fullname" . }}-preview-cleanup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-preview-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  # bounded: a pre-delete hook holds the preview's deletion until the Job ends
  activeDeadlineSeconds: 600
  # no ttlSecondsAfterFinished: a success is deleted by its hook policy, a failure keeps its pod and log for a look
  template:
    metadata:
      labels:
        velero.io/exclude-from-backup: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "schnappy.fullname" . }}-preview-cleanup
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cleanup
          image: alpine/k8s:1.35.9
          env:
            - name: PR_NUMBER
              value: {{ .Values.previewNumber | quote }}
            - name: SHARED_KAFKA_NS
              value: {{ .Values.preview.sharedNamespace | default "schnappy-production" | quote }}
            - name: SCYLLA_CONTACT_POINTS
              valueFrom:
                secretKeyRef:
                  name: schnappy-shared-scylla
                  key: SCYLLA_CONTACT_POINTS
                  optional: true
            - name: SCYLLA_USER
              valueFrom:
                secretKeyRef:
                  name: schnappy-shared-scylla
                  key: SCYLLA_USER
                  optional: true
            - name: SCYLLA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: schnappy-shared-scylla
                  key: SCYLLA_PASSWORD
                  optional: true
            - name: KEYCLOAK_REALM_URL
              valueFrom:
                secretKeyRef:
                  name: schnappy-shared-keycloak
                  key: KEYCLOAK_REALM_URL
                  optional: true
            - name: KEYCLOAK_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: schnappy-shared-keycloak
                  key: KEYCLOAK_ADMIN_TOKEN
                  optional: true
          command:
            - sh
            - -c
            - |
              set -eu
              # Kafka topics — KafkaTopic CRs prefixed pr-${PR_NUMBER}-. A "no" from can-i skips them, said; any failure of the
              # check, the list or a delete (a time-out included) fails the hook - swallowed, they read as "nothing to do"
              if CAN=$(timeout 10 kubectl auth can-i list kafkatopics -n "$SHARED_KAFKA_NS" 2>&1); then
                TOPICS=$(timeout 10 kubectl -n "$SHARED_KAFKA_NS" get kafkatopics -o name)
                for topic in $(echo "$TOPICS" | grep "kafkatopic.*pr-${PR_NUMBER}-" || true); do
                  timeout 60 kubectl -n "$SHARED_KAFKA_NS" delete "$topic"
                done
              elif [ "$CAN" = no ]; then
                echo "[note] no right to list KafkaTopics in $SHARED_KAFKA_NS: pr-${PR_NUMBER}- topics left"
              else
                echo "ERROR: checking the right to list KafkaTopics failed: $CAN"; exit 1
              fi
              # Scylla keyspace
              if [ -n "${SCYLLA_CONTACT_POINTS:-}" ]; then
                # cqlsh isn't in alpine/k8s; use a one-shot cqlsh image as a sidecar
                # in a follow-up if this becomes load-bearing. For now just log.
                echo "[note] scylla keyspace pr_${PR_NUMBER}_ left for manual cleanup"
              fi
              # Keycloak client
              if [ -n "${KEYCLOAK_REALM_URL:-}" ] && [ -n "${KEYCLOAK_ADMIN_TOKEN:-}" ]; then
                CLIENT_ID="preview-pr-${PR_NUMBER}"
                # the answer read before it is searched: a failed lookup fails the hook, never "no client"
                CLIENTS=$(wget -T 10 -qO- --header="Authorization: Bearer $KEYCLOAK_ADMIN_TOKEN" \
                  "$KEYCLOAK_REALM_URL/clients?clientId=$CLIENT_ID")
                cid=$(echo "$CLIENTS" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)
                if [ -n "$cid" ]; then
                  wget -T 10 -qO- --method=DELETE --header="Authorization: Bearer $KEYCLOAK_ADMIN_TOKEN" \
                    "$KEYCLOAK_REALM_URL/clients/$cid" > /dev/null
                fi
              fi
              echo "preview cleanup done for pr-${PR_NUMBER}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
