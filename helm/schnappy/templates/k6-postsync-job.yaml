{{- if eq (.Values.smokeTest.enabled | toString) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-k6-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: k6-smoke
        app.kubernetes.io/part-of: schnappy
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for the gateway+apps to actually serve /api/health before
        # k6 starts. Stops the Job from tripping the rate==1.0 threshold
        # while a cold cluster is still warming up (Istio sidecars,
        # Keycloak, mTLS handshakes). 10-min ceiling; fails loudly if
        # services genuinely never come up.
        - name: wait-for-ready
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                if curl -fsS --max-time 5 "${BASE_URL}/api/health" >/dev/null; then
                  echo "ready after $((i*10))s"
                  exit 0
                fi
                sleep 10
              done
              echo "services not ready after 600s — bailing"
              exit 1
          env:
            - name: BASE_URL
              value: {{ .Values.smokeTest.baseUrl | quote }}
          resources:
            requests: { cpu: 10m, memory: 32Mi, ephemeral-storage: 16Mi }
            limits: { cpu: 200m, memory: 64Mi, ephemeral-storage: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: k6
          image: {{ .Values.smokeTest.image }}
          command: ['k6', 'run', '--no-usage-report', '--out', 'experimental-prometheus-rw', '/scripts/smoke-test.js']
          resources:
            requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 64Mi }
            limits: { cpu: 1000m, memory: 512Mi, ephemeral-storage: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: K6_DNS
              value: "ttl=5s,select=first,policy=preferIPv4"
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: "http://schnappy-mimir.schnappy-infra.svc:9009/api/v1/push"
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: "p(95),p(99),avg,min,max,med"
            - name: BASE_URL
              value: {{ .Values.smokeTest.baseUrl | quote }}
            - name: KEYCLOAK_URL
              value: "https://{{ .Values.keycloak.hostname }}"
            - name: KEYCLOAK_PUBLIC_URL
              value: "https://{{ .Values.keycloak.hostname }}"
            {{- if .Values.smokeTest.clientSecretName }}
            - name: K6_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smokeTest.clientSecretName }}
                  key: CLIENT_SECRET
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: schnappy-k6-smoke
      restartPolicy: Never
{{- end }}
