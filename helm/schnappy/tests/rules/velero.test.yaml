# promtool unit tests for the Velero alerts (schnappy-observability; rendered by .woodpecker/render-rules.sh).
# A failed scheduled backup is VeleroScheduledBackupFailed, never VeleroDailyBackupMissing (the one alert the Vagrant
# copy allows); a PartiallyFailed backup leaves the last status at success and is VeleroBackupPartiallyFailed alone;
# the age alerts read the last success from Prometheus' history (a Velero restart drops the series until its next
# success) and fire with no history (a fresh Prometheus or copy); a Velero gone is VeleroDown at once.
rule_files:
  - rendered-infra-rules.yaml

evaluation_interval: 1m

tests:
  # a failed daily backup, both last successes recent: the failure alert alone
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_status{schedule="velero-schnappy-daily"}'
        values: '0x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroScheduledBackupFailed
        exp_alerts:
          - exp_labels: { severity: critical, schedule: velero-schnappy-daily }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroScheduledBackupFailed
              summary: "Velero scheduled backup failed"
              description: "The last backup of schedule velero-schnappy-daily failed."
      - eval_time: 20m
        alertname: VeleroDailyBackupMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts: []

  # no daily success in 30 h: missing alone
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_status{schedule="velero-schnappy-daily"}'
        values: '1x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroDailyBackupMissing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDailyBackupMissing
              summary: "Velero daily backup missing"
              description: "No successful schnappy-daily backup in the last 30h."
      - eval_time: 20m
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts: []

  # Velero restarted 10 minutes in, both last successes recent before it: their series gone since, neither age alert
  # (the history holds them) - 40 min in: a plain series is stale 5 min after its last sample, firing 10 min later
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_status{schedule="velero-schnappy-daily"}'
        values: '1x60'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x10'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 40m
        alertname: VeleroDailyBackupMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts: []

  # no history at all (a fresh copy or Prometheus): both age alerts fire
  - interval: 1m
    input_series:
      - series: 'up{job="unrelated"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroDailyBackupMissing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDailyBackupMissing
              summary: "Velero daily backup missing"
              description: "No successful schnappy-daily backup in the last 30h."
      - eval_time: 20m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroWeeklyBackupMissing
              summary: "Velero weekly backup missing"
              description: "No fully successful full-weekly backup in the last 8 days (a PartiallyFailed one does not count)."

  # production's weekly backup until 2026-10-11: PartiallyFailed every week, last status still success, the daily
  # fine; the partial failure alerts for its hour, the weekly one stays missing, no failure alert
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_status{schedule="velero-full-weekly"}'
        values: '1x150'
      - series: 'velero_backup_partial_failure_total{schedule="velero-full-weekly"}'
        values: '0x30 1x120'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x150'
    alert_rule_test:
      - eval_time: 40m
        alertname: VeleroBackupPartiallyFailed
        exp_alerts:
          - exp_labels: { severity: warning, schedule: velero-full-weekly }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroBackupPartiallyFailed
              summary: "Velero backup partially failed"
              description: "A backup of schedule velero-full-weekly ended PartiallyFailed: some items or volumes are missing from it."
      - eval_time: 40m
        alertname: VeleroScheduledBackupFailed
        exp_alerts: []
      - eval_time: 40m
        alertname: VeleroDailyBackupMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroWeeklyBackupMissing
              summary: "Velero weekly backup missing"
              description: "No fully successful full-weekly backup in the last 8 days (a PartiallyFailed one does not count)."
      - eval_time: 140m
        alertname: VeleroBackupPartiallyFailed
        exp_alerts: []

  # the last weekly success 9 days old (at -777600 s; a week old would be fine): missing
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '-777600x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroWeeklyBackupMissing
              summary: "Velero weekly backup missing"
              description: "No fully successful full-weekly backup in the last 8 days (a PartiallyFailed one does not count)."
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '-604800x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroWeeklyBackupMissing
        exp_alerts: []

  # Velero gone after it reported (scaled to 0, deleted - no target; its node-agent still up): VeleroDown after 15 min;
  # the daily age alert silent while the history's last success is younger than 30 h, firing once it is older
  - interval: 10m
    input_series:
      - series: 'up{namespace="velero", container="velero"}'
        values: '1x1'
      - series: 'up{namespace="velero", container="node-agent"}'
        values: '1x200'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x1'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x1'
    alert_rule_test:
      - eval_time: 40m
        alertname: VeleroDown
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDown
              summary: "Velero server down"
              description: "No Velero server has answered its metrics scrape for 15 minutes: no backup runs."
      - eval_time: 29h
        alertname: VeleroDailyBackupMissing
        exp_alerts: []
      - eval_time: 30h30m
        alertname: VeleroDailyBackupMissing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDailyBackupMissing
              summary: "Velero daily backup missing"
              description: "No successful schnappy-daily backup in the last 30h."
  # a Velero answering its scrape: no VeleroDown
  - interval: 1m
    input_series:
      - series: 'up{namespace="velero", container="velero"}'
        values: '1x30'
      - series: 'up{namespace="velero", container="node-agent"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroDown
        exp_alerts: []
  # a Velero target failing its scrape (up 0): VeleroDown
  - interval: 1m
    input_series:
      - series: 'up{namespace="velero", container="velero"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroDown
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDown
              summary: "Velero server down"
              description: "No Velero server has answered its metrics scrape for 15 minutes: no backup runs."
  # the daily threshold: its last success 31 h old fires, 29 h old does not (at -111600 s and -104400 s)
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '-111600x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroDailyBackupMissing
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDailyBackupMissing
              summary: "Velero daily backup missing"
              description: "No successful schnappy-daily backup in the last 30h."
  - interval: 1m
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '-104400x30'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: VeleroDailyBackupMissing
        exp_alerts: []
  # the weekly window: its last success's series gone after a day (a restart), the history holds it - silent at 7 d,
  # firing past 8 d
  - interval: 1h
    input_series:
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-full-weekly"}'
        values: '0x24'
      - series: 'velero_backup_last_successful_timestamp{schedule="velero-schnappy-daily"}'
        values: '0x200'
    alert_rule_test:
      - eval_time: 7d
        alertname: VeleroWeeklyBackupMissing
        exp_alerts: []
      - eval_time: 8d2h
        alertname: VeleroWeeklyBackupMissing
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroWeeklyBackupMissing
              summary: "Velero weekly backup missing"
              description: "No fully successful full-weekly backup in the last 8 days (a PartiallyFailed one does not count)."
  # a Velero gone for 10 minutes and back (a restart, a drain): VeleroDown pending, never firing - its 15 minutes
  - interval: 1m
    input_series:
      - series: 'up{namespace="velero", container="velero"}'
        values: '1x5 _x10 1x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: VeleroDown
        exp_alerts: []
      - eval_time: 30m
        alertname: VeleroDown
        exp_alerts: []
  # VeleroDown's 15 minutes pinned both ways (explicit 0s: no lookback blur): down 13 minutes - none; 16 - firing
  - interval: 1m
    input_series:
      - series: 'up{namespace="velero", container="velero"}'
        values: '1x5 0x13 1x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: VeleroDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{namespace="velero", container="velero"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 22m
        alertname: VeleroDown
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              runbook_url: https://runbooks.pmon.dev/VeleroDown
              summary: "Velero server down"
              description: "No Velero server has answered its metrics scrape for 15 minutes: no backup runs."
