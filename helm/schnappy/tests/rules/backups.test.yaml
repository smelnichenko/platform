# promtool unit tests for the infra-backups group (schnappy-observability; rendered by .woodpecker/render-rules.sh).
# Postgres: CNPG's Cluster status through kube-state-metrics - archiving failing, the last backup failed, none for 26 h,
# none ever on a cluster with a backup store. Scylla Manager: its scheduler's last success per live backup task - one the
# operator's ScyllaDBManagerTask names (none for 26 h, none since Manager started) -, a backup or repair run in ERROR or
# ABORTED, Manager not scraped.
rule_files:
  - rendered-infra-rules.yaml

evaluation_interval: 1m

tests:
  # Postgres: one cluster healthy, one archiving failing, one whose last backup failed, one stale, one never backed up
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_condition{namespace="p", cluster="ok", type="ContinuousArchiving"}'
        values: '1x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="ok", type="LastBackupSucceeded"}'
        values: '1x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="ok"}'
        values: '0x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="arch", type="ContinuousArchiving"}'
        values: '0x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="arch"}'
        values: '0x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="failed", type="LastBackupSucceeded", reason="LastBackupFailed"}'
        values: '0x120'
      # a backup running (CNPG sets the condition False, reason BackupStarted, until it ends - every hour, 2026-10-15:
      # pending at each one): never this alert; one that never ends is PostgresBackupStuck's
      - series: 'cnpg_cluster_condition{namespace="p", cluster="running", type="LastBackupSucceeded", reason="BackupStarted"}'
        values: '0x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="running"}'
        values: '0x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="failed"}'
        values: '0x120'
      # a cluster with no archiving and no backup (the test environment's): never alerts
      - series: 'cnpg_cluster_condition{namespace="t", cluster="test", type="Ready"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: PostgresArchivingFailed
        exp_alerts:
          - exp_labels: {severity: critical, namespace: p, cluster: arch, type: ContinuousArchiving}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresArchivingFailed"
              summary: "Postgres p/arch: WAL archiving failing"
      - eval_time: 60m
        alertname: PostgresBackupFailed
        exp_alerts:
          - exp_labels: {severity: critical, namespace: p, cluster: failed, type: LastBackupSucceeded, reason: LastBackupFailed}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupFailed"
              summary: "Postgres p/failed: its last backup failed"
      # backups at t=0: 26 h later (+1 h for) they are stale; the "ok" one is the stale one too here - see the next test
      - eval_time: 60m
        alertname: PostgresBackupMissed
      # running for an hour: no backup stuck yet
      - eval_time: 60m
        alertname: PostgresBackupStuck
      # the Clusters' status scraped (the "test" one's Ready): watched
      - eval_time: 60m
        alertname: PostgresBackupsUnwatched
  # kube-state-metrics' CNPG series gone at 30 m (its custom-resource config broken, or it not scraped): after 30 m more
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_condition{namespace="p", cluster="ok", type="Ready"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 50m
        alertname: PostgresBackupsUnwatched
      - eval_time: 70m
        alertname: PostgresBackupsUnwatched
        exp_alerts:
          - exp_labels: {severity: warning, type: Ready}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupsUnwatched"
              summary: "No CNPG Cluster's status scraped - Postgres' backups and archiving are watched by nothing"
  # a backup that never ends (its status lost: an API server restart during it, 2026-10-15) - stuck after 3 h; one that
  # runs 2 h and ends, and a failed one, never
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_condition{namespace="p", cluster="stuck", type="LastBackupSucceeded", reason="BackupStarted"}'
        values: '0x300'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="slow", type="LastBackupSucceeded", reason="BackupStarted"}'
        values: '0x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="slow", type="LastBackupSucceeded", reason="LastBackupSucceeded"}'
        values: '_x120 1x180'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="failed", type="LastBackupSucceeded", reason="LastBackupFailed"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 179m
        alertname: PostgresBackupStuck
      - eval_time: 4h
        alertname: PostgresBackupStuck
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: stuck, type: LastBackupSucceeded, reason: BackupStarted}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupStuck"
              summary: "Postgres p/stuck: a backup running for 3 h"
  # minute samples over 30 h (a series with no sample for 5 minutes is gone: hourly ones never let a for: run)
  - interval: 1m
    input_series:
      # fresh: a backup each day; stale: the last at day 0
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="fresh"}'
        values: '0x1439 86400x360'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="stale"}'
        values: '0x1800'
      # a backup store, never a backup: after 26 h
      - series: 'cnpg_cluster_backup_store_info{namespace="p", cluster="never"}'
        values: '1x1800'
      # a backup store, and backed up: never this alert (its own staleness is PostgresBackupMissed's)
      - series: 'cnpg_cluster_backup_store_info{namespace="p", cluster="fresh"}'
        values: '1x1800'
      # no store, archiving "succeeding" all the same (CNPG 1.30's condition with nothing to archive to - production's
      # test environment, 2026-10-14): never this alert
      - series: 'cnpg_cluster_condition{namespace="t", cluster="test", type="ContinuousArchiving"}'
        values: '1x1800'
    alert_rule_test:
      - eval_time: 25h
        alertname: PostgresBackupMissed
      - eval_time: 28h
        alertname: PostgresBackupMissed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: stale}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupMissed"
              summary: "Postgres p/stale: no successful backup for 26 h"
      - eval_time: 25h
        alertname: PostgresBackupNeverSucceeded
      - eval_time: 27h
        alertname: PostgresBackupNeverSucceeded
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: never}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupNeverSucceeded"
              summary: "Postgres p/never has a backup store but no successful backup"
  # Scylla Manager
  - interval: 1m
    input_series:
      - series: 'up{job="scylla-manager", namespace="scylla-manager"}'
        values: '1x1800'
      - series: 'scylla_manager_scheduler_last_success{cluster="c", task="fresh", type="backup"}'
        values: '0x1439 86400x360'
      - series: 'scylla_manager_scheduler_last_success{cluster="c", task="stale", type="backup"}'
        values: '0x1800'
      # the live backup tasks (the operator's ScyllaDBManagerTasks, their Manager IDs)
      - series: 'scylladb_manager_task_info{namespace="n", name="daily", task_type="Backup", task_id="fresh"}'
        values: '1x1800'
      - series: 'scylladb_manager_task_info{namespace="n", name="old", task_type="Backup", task_id="stale"}'
        values: '1x1800'
      - series: 'scylladb_manager_task_info{namespace="n", name="new", task_type="Backup", task_id="new"}'
        values: '1x1800'
      - series: 'scylladb_manager_task_info{namespace="n", name="weekly", task_type="Repair", task_id="rep"}'
        values: '1x1800'
      # Manager restarted: the task's runs counted from 0, no last success since
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="new", type="backup", status="DONE"}'
        values: '0x1800'
      # a deleted task (its cluster's too): Manager still exports its counters at 0 - and a last success it kept (production,
      # 2026-10-14): neither alerts
      - series: 'scylla_manager_scheduler_run_total{cluster="gone", task="deleted", type="backup", status="DONE"}'
        values: '0x1800'
      - series: 'scylla_manager_scheduler_last_success{cluster="gone", task="deleted-old", type="backup"}'
        values: '0x1800'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="fresh", type="backup", status="DONE"}'
        values: '1x1800'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="stale", type="backup", status="DONE"}'
        values: '1x1800'
      # a healthcheck's last success: no backup alert of its own
      - series: 'scylla_manager_scheduler_last_success{cluster="c", task="hc", type="healthcheck"}'
        values: '0x1800'
    alert_rule_test:
      - eval_time: 25h
        alertname: ScyllaBackupMissed
      - eval_time: 28h
        alertname: ScyllaBackupMissed
        exp_alerts:
          - exp_labels: {severity: warning, cluster: c, task: stale, type: backup}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaBackupMissed"
              summary: "Scylla Manager: backup task stale of cluster c has not succeeded for 26 h"
      - eval_time: 27h
        alertname: ScyllaBackupNeverSucceeded
        exp_alerts:
          - exp_labels: {severity: warning, namespace: n, name: new, task: new}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaBackupNeverSucceeded"
              summary: "Scylla Manager: backup task n/new (new) has not succeeded since Manager started"
      - eval_time: 10h
        alertname: ScyllaManagerDown
      # the backup tasks listed, Manager scraped: watched
      - eval_time: 10h
        alertname: ScyllaBackupsUnwatched
  - interval: 1m
    input_series:
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="r", type="repair", status="ERROR"}'
        values: '0x10 1x50'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="b", type="backup", status="ABORTED"}'
        values: '0x60'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="h", type="healthcheck", status="ERROR"}'
        values: '0x10 5x50'
    alert_rule_test:
      - eval_time: 5m
        alertname: ScyllaManagerTaskFailed
      - eval_time: 20m
        alertname: ScyllaManagerTaskFailed
        exp_alerts:
          - exp_labels: {severity: warning, cluster: c, task: r, type: repair, status: ERROR}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaManagerTaskFailed"
              summary: "Scylla Manager: a repair run of task r (cluster c) ended ERROR"
      # Manager not scraped at all for 15 minutes
      - eval_time: 20m
        alertname: ScyllaManagerDown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaManagerDown"
              summary: "Scylla Manager is not scraped - its backups and repairs are watched by nothing"
      # Manager not scraped: no task listed either - ScyllaManagerDown's, not this one's
      - eval_time: 60m
        alertname: ScyllaBackupsUnwatched
  # Manager scraped; its backup task listed for 30 minutes, then gone (kube-state-metrics' config broken): after 30 m more
  - interval: 1m
    input_series:
      - series: 'up{job="scylla-manager", namespace="scylla-manager"}'
        values: '1x120'
      - series: 'scylladb_manager_task_info{namespace="n", name="daily", task_type="Backup", task_id="t"}'
        values: '1x30'
      - series: 'scylladb_manager_task_info{namespace="n", name="weekly", task_type="Repair", task_id="r"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 50m
        alertname: ScyllaBackupsUnwatched
      - eval_time: 70m
        alertname: ScyllaBackupsUnwatched
        exp_alerts:
          - exp_labels: {severity: warning, task_type: Backup}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaBackupsUnwatched"
              summary: "No Scylla Manager backup task listed - Scylla's backups are watched by nothing"
  # kube-state-metrics rolled (a new pod: new series, its pod and instance) while a backup ran: the 3 h counted across
  # the roll - counted per series, it began again at 100 m and nothing fired at 4 h
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_condition{namespace="p", cluster="roll", type="LastBackupSucceeded", reason="BackupStarted", pod="ksm-a", instance="10.0.0.1:8080"}'
        values: '0x100'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="roll", type="LastBackupSucceeded", reason="BackupStarted", pod="ksm-b", instance="10.0.0.2:8080"}'
        values: '_x100 0x200'
    alert_rule_test:
      - eval_time: 4h
        alertname: PostgresBackupStuck
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: roll, type: LastBackupSucceeded, reason: BackupStarted}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupStuck"
              summary: "Postgres p/roll: a backup running for 3 h"
  # the same across a roll for a store never backed up: its 26 h counted from the first pod's series
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_backup_store_info{namespace="p", cluster="never", pod="ksm-a", instance="10.0.0.1:8080"}'
        values: '1x600'
      - series: 'cnpg_cluster_backup_store_info{namespace="p", cluster="never", pod="ksm-b", instance="10.0.0.2:8080"}'
        values: '_x600 1x1200'
    alert_rule_test:
      - eval_time: 27h
        alertname: PostgresBackupNeverSucceeded
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: never}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupNeverSucceeded"
              summary: "Postgres p/never has a backup store but no successful backup"
  # Manager scraped, the backup task listed without its Manager ID yet (status.taskID empty): the joins drop it -
  # unwatched as if none were listed
  - interval: 1m
    input_series:
      - series: 'up{job="scylla-manager", namespace="scylla-manager"}'
        values: '1x120'
      - series: 'scylladb_manager_task_info{namespace="n", name="daily", task_type="Backup", task_id=""}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 40m
        alertname: ScyllaBackupsUnwatched
        exp_alerts:
          - exp_labels: {severity: warning, task_type: Backup}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaBackupsUnwatched"
              summary: "No Scylla Manager backup task listed - Scylla's backups are watched by nothing"
