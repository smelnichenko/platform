# promtool unit tests for the infra-backups group (schnappy-observability; rendered by .woodpecker/render-rules.sh).
# Postgres: CNPG's Cluster status through kube-state-metrics - archiving failing, the last backup failed, none for 26 h,
# none ever on a cluster that archives. Scylla Manager: its scheduler's last success per backup task (none for 26 h,
# none since Manager started), a backup or repair run in ERROR or ABORTED, Manager not scraped.
rule_files:
  - rendered-infra-rules.yaml

evaluation_interval: 1m

tests:
  # Postgres: one cluster healthy, one archiving failing, one whose last backup failed, one stale, one never backed up
  - interval: 1m
    input_series:
      - series: 'cnpg_cluster_condition{namespace="p", cluster="ok", type="ContinuousArchiving"}'
        values: '1x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="ok", type="LastBackupSucceeded"}'
        values: '1x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="ok"}'
        values: '0x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="arch", type="ContinuousArchiving"}'
        values: '0x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="arch"}'
        values: '0x120'
      - series: 'cnpg_cluster_condition{namespace="p", cluster="failed", type="LastBackupSucceeded"}'
        values: '0x120'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="failed"}'
        values: '0x120'
      # a cluster with no archiving and no backup (the test environment's): never alerts
      - series: 'cnpg_cluster_condition{namespace="t", cluster="test", type="Ready"}'
        values: '1x120'
    alert_rule_test:
      - eval_time: 60m
        alertname: PostgresArchivingFailed
        exp_alerts:
          - exp_labels: {severity: critical, namespace: p, cluster: arch, type: ContinuousArchiving}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresArchivingFailed"
              summary: "Postgres p/arch: WAL archiving failing"
      - eval_time: 60m
        alertname: PostgresBackupFailed
        exp_alerts:
          - exp_labels: {severity: critical, namespace: p, cluster: failed, type: LastBackupSucceeded}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupFailed"
              summary: "Postgres p/failed: its last backup failed"
      # backups at t=0: 26 h later (+1 h for) they are stale; the "ok" one is the stale one too here - see the next test
      - eval_time: 60m
        alertname: PostgresBackupMissed
  # minute samples over 30 h (a series with no sample for 5 minutes is gone: hourly ones never let a for: run)
  - interval: 1m
    input_series:
      # fresh: a backup each day; stale: the last at day 0
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="fresh"}'
        values: '0x1439 86400x360'
      - series: 'cnpg_cluster_last_successful_backup_timestamp_seconds{namespace="p", cluster="stale"}'
        values: '0x1800'
      # archives, never a backup: after 26 h
      - series: 'cnpg_cluster_condition{namespace="p", cluster="never", type="ContinuousArchiving"}'
        values: '1x1800'
      # archives, and backed up: never this alert (its own staleness is PostgresBackupMissed's)
      - series: 'cnpg_cluster_condition{namespace="p", cluster="fresh", type="ContinuousArchiving"}'
        values: '1x1800'
    alert_rule_test:
      - eval_time: 25h
        alertname: PostgresBackupMissed
      - eval_time: 28h
        alertname: PostgresBackupMissed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: stale}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupMissed"
              summary: "Postgres p/stale: no successful backup for 26 h"
      - eval_time: 25h
        alertname: PostgresBackupNeverSucceeded
      - eval_time: 27h
        alertname: PostgresBackupNeverSucceeded
        exp_alerts:
          - exp_labels: {severity: warning, namespace: p, cluster: never, type: ContinuousArchiving}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/PostgresBackupNeverSucceeded"
              summary: "Postgres p/never archives but has no successful backup"
  # Scylla Manager
  - interval: 1m
    input_series:
      - series: 'up{job="scylla-manager", namespace="scylla-manager"}'
        values: '1x1800'
      - series: 'scylla_manager_scheduler_last_success{cluster="c", task="fresh", type="backup"}'
        values: '0x1439 86400x360'
      - series: 'scylla_manager_scheduler_last_success{cluster="c", task="stale", type="backup"}'
        values: '0x1800'
      # Manager restarted: the task's runs counted from 0, no last success since
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="new", type="backup", status="DONE"}'
        values: '0x1800'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="fresh", type="backup", status="DONE"}'
        values: '1x1800'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="stale", type="backup", status="DONE"}'
        values: '1x1800'
      # a healthcheck's last success: no backup alert of its own
      - series: 'scylla_manager_scheduler_last_success{cluster="c", task="hc", type="healthcheck"}'
        values: '0x1800'
    alert_rule_test:
      - eval_time: 25h
        alertname: ScyllaBackupMissed
      - eval_time: 28h
        alertname: ScyllaBackupMissed
        exp_alerts:
          - exp_labels: {severity: warning, cluster: c, task: stale, type: backup}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaBackupMissed"
              summary: "Scylla Manager: backup task stale of cluster c has not succeeded for 26 h"
      - eval_time: 27h
        alertname: ScyllaBackupNeverSucceeded
        exp_alerts:
          - exp_labels: {severity: warning, cluster: c, task: new}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaBackupNeverSucceeded"
              summary: "Scylla Manager: backup task new of cluster c has not succeeded since Manager started"
      - eval_time: 10h
        alertname: ScyllaManagerDown
  - interval: 1m
    input_series:
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="r", type="repair", status="ERROR"}'
        values: '0x10 1x50'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="b", type="backup", status="ABORTED"}'
        values: '0x60'
      - series: 'scylla_manager_scheduler_run_total{cluster="c", task="h", type="healthcheck", status="ERROR"}'
        values: '0x10 5x50'
    alert_rule_test:
      - eval_time: 5m
        alertname: ScyllaManagerTaskFailed
      - eval_time: 20m
        alertname: ScyllaManagerTaskFailed
        exp_alerts:
          - exp_labels: {severity: warning, cluster: c, task: r, type: repair, status: ERROR}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaManagerTaskFailed"
              summary: "Scylla Manager: a repair run of task r (cluster c) ended ERROR"
      # Manager not scraped at all for 15 minutes
      - eval_time: 20m
        alertname: ScyllaManagerDown
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              runbook_url: "https://runbooks.pmon.dev/ScyllaManagerDown"
              summary: "Scylla Manager is not scraped - its backups and repairs are watched by nothing"
