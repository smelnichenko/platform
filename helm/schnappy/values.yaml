# Core application services chart (cache-bust 1)
nameOverride: schnappy

# Per-PR preview env mode. When true, the chart emits the preview
# HTTPRoute on `<ingress.host>` against the prod Istio gateway, and a
# pre-delete Job that prunes per-PR shared-resource artifacts (Kafka
# topics, Scylla keyspace, MinIO bucket, Keycloak client). Set
# per-Application by the schnappy-pr-envs ApplicationSet.
previewMode: false
previewNumber: ""
previewSourceRepo: ""
preview:
  # Namespace where the shared Kafka cluster (KafkaTopic CRs) lives.
  sharedNamespace: schnappy-production

# Optional: where the preview HTTPRoute attaches (default = the same
# Istio gateway used by prod). Override per-cluster if you have a
# dedicated preview gateway.
ingress:
  host: ""
  gatewayName: schnappy-istio-gateway
  gatewayNamespace: istio-system

vault:
  secretsEnabled: false
  secretPathPrefix: "secret/data/schnappy"

networkPolicies:
  enabled: true

prometheus:
  enabled: true

alerts:
  enabled: false

# Frontend
site:
  enabled: true
  dnsResolver: ""
  image:
    repository: git.pmon.dev/schnappy/site
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { memory: "64Mi", cpu: "50m" }
    limits: { memory: "128Mi", cpu: "200m" }
  service:
    type: ClusterIP
    port: 8080

# Game (Godot web export)
games: []
gameDefaults:
  pullPolicy: IfNotPresent
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

# Backend API
app:
  image:
    repository: git.pmon.dev/schnappy/monitor
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  javaOpts: "-Xmx1536m"
  hikari:
    minimumIdle: 2
    maximumPoolSize: 25
    idleTimeout: 300000
    maxLifetime: 1200000
    connectionTimeout: 20000
  resources:
    requests: { memory: "512Mi", cpu: "250m" }
    limits: { memory: "2Gi", cpu: "2500m" }
  service:
    type: ClusterIP
    port: 8080
  ingress:
    # Production uses Istio HTTPRoute (schnappy-mesh chart); keep this off.
    enabled: false

# Authentication
auth:
  existingSecret: ""
  tokenExpiration: 1h
  registrationEnabled: true
  registrationApproval:
    mode: ai
    criteria: ""
    defaultGroup: Users

# Monitor configuration
monitor:
  enabled: true
  http:
    connectTimeout: 10s
    readTimeout: 30s
    userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:134.0) Gecko/20100101 Firefox/134.0"

# Mail (optional)
mail:
  enabled: false
  host: smtp.gmail.com
  port: 587
  username: ""
  password: ""
  existingSecret: ""
  fromAddress: "noreply@example.com"
  appUrl: "http://localhost:3000"

# AI (optional)
ai:
  enabled: false
  apiKey: ""
  existingSecret: ""
  model: "claude-sonnet-4-5-20250929"

# Webhook (Resend inbound email)
webhook:
  enabled: false
  signingSecret: ""
  apiKey: ""
  existingSecret: ""

# API Gateway

# Admin / User Service
admin:
  enabled: false
  image:
    repository: git.pmon.dev/schnappy/admin
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  javaOpts: "-Xmx512m"
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "1Gi", cpu: "2000m" }
  service:
    type: ClusterIP
    port: 8080

# Chat microservice
chatService:
  enabled: false
  image:
    repository: git.pmon.dev/schnappy/chat
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  javaOpts: "-Xmx512m"
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "1Gi", cpu: "2000m" }
  service:
    type: ClusterIP
    port: 8080

# Chess microservice
chessService:
  enabled: false
  image:
    repository: git.pmon.dev/schnappy/chess
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  javaOpts: "-Xmx512m"
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "1Gi", cpu: "2000m" }
  service:
    type: ClusterIP
    port: 8080


# masi — IT job & company registry with reviewed CV tuning (served at /api/masi).
# Single replica by design: the source scheduler map and per-source locks are in-memory.
masiService:
  enabled: false
  image:
    repository: git.pmon.dev/schnappy/masi
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  javaOpts: "-Xmx768m"
  resources:
    requests: { memory: "512Mi", cpu: "100m" }
    limits: { memory: "1536Mi", cpu: "2000m" }
  service:
    type: ClusterIP
    port: 8080
  # Anthropic access on masi's OWN key (Vault <prefix>/ai-masi, property api_key), never the
  # shared `ai` key: a runaway must be revocable without breaking admin's registration
  # approval, and the console usage report must split per service. existingSecret names the
  # Secret the ExternalSecret creates (key ANTHROPIC_API_KEY); empty = no AI env at all.
  ai:
    enabled: false
    existingSecret: ""
    tuningModel: "claude-opus-5"
    extractModel: "claude-haiku-4-5-20251001"
    # the AI match: a verdict per requirement against the master's evidence (about 0.008 USD a posting)
    matchModel: "claude-haiku-4-5-20251001"
    dailyBudgetUsd: "1"
    monthlyBudgetUsd: "20"
    inFlight: 2
  apiDocs:
    # The OpenAPI document and Swagger UI (/api/masi/api-docs, /api/masi/swagger-ui/): off unless an environment
    # switches them on — test does, production never; the gateway answers the docs paths to LAN callers only besides.
    enabled: false
  tuning:
    # Prepare a package for every new open job automatically (else "Prepare" is manual).
    auto: false
  mail:
    # The weekly digest by e-mail to every enabled user with an active CV master: figures and company names, nothing of
    # a CV. Uses the chart's mail.* server settings and its Vault secret (<prefix>/mail), which this switch alone pulls
    # in — mail.enabled (monitor's and admin's mails) may stay off. Opens one egress rule to the SMTP port.
    enabled: false
    siteUrl: ""   # where the digest's links point, e.g. https://pmon.dev
    # Mail on a schedule (Monday's digest, its retries) is OPT-IN. Off, a digest leaves only when somebody asks for it.
    weeklyAuto: false
    # A NON-production environment's mail sink: its user table follows the identity provider and holds real people's
    # addresses, so with this set every digest goes here and none to a reader. Leave empty in production.
    deliverAllTo: ""
  analysis:
    # Read open jobs with the cheap model BEFORE a package is asked for, so every job gets a match score against the
    # active CV master (the score itself is free and always computed). Costs a fraction of a cent per job, capped by the
    # daily/monthly budgets and the SCORE purpose share; needs ai.enabled. perTick jobs every five minutes.
    auto: false
    perTick: 10
    # Then match analysed jobs against the active masters by AI: the verified verdict per requirement replaces the free
    # word score. Under the MATCH purpose share (0.25 of the day); needs ai.enabled. matchPerTick postings a tick.
    matchAuto: false
    matchPerTick: 10
  http:
    # The only hosts masi's collectors may contact — exact names, no wildcard, checked in the fetcher and in the
    # browser's request guard. A host that is not here cannot be contacted; an empty list means
    # none can. One entry per seeded source's own host (list page, API and job-detail host); a new
    # source, or a job-detail host a source links to, is added HERE before it can be fetched — the
    # run's warning names the refused host.
    allowedHosts:
      - cv.ee
      - www.cv.ee
      - www.tootukassa.ee
      - bolt.eu
      - avaandmed.ariregister.rik.ee
      - itl.ee
      - www.tehnopol.ee
      - api.smartrecruiters.com
      - boards-api.greenhouse.io
      - api.lever.co
      - api.ashbyhq.com
      - jobs.swedbank.com
      - luminorbank.teamtailor.com
      - starship.teamtailor.com
      - fractory.teamtailor.com
      - comodule.teamtailor.com
      - careers.datel.ee
      - careers.milrem.com
      - careers.pactum.com
      - www.helmes.com
      - helmes.teamdash.com
      - cyber.ee
      - jobs.bigbank.eu
      - www.tehik.ee
      - lhv.teamdash.com
      # the TeamDash job pages behind those three employer sites (first live runs 2026-09-22: cards found, every page refused)
      - cyber.teamdash.com
      - bigbank.teamdash.com
      - tehik.teamdash.com
      # an ATS row auto-detected from a MeetFrank apply link
      - sisutech.teamtailor.com
      # masi #25 and #28 (2026-09-22): the employer feeds and MeetFrank's API - seeded disabled, enabled on the Sources page
      - apply.workable.com
      - salv.jobs.personio.de
      - ridango.bamboohr.com
      - api.meetfrank.com
  alerts:
    # MasiCostRate fires above this hourly LLM spend (USD/h); the budgets are the daily/monthly caps.
    costRateUsdPerHour: 1
  # Headless Chromium for BROWSER collectors: its own pod, connected over CDP. The masi image
  # never contains a browser. Pinned by DIGEST (v2.56.7); the CD sed anchor (`# masi$`) never
  # touches this block. Requires no token: access is the NetworkPolicy (ingress from masi
  # only) plus the dedicated mesh ALLOW policy for masi's principal.
  browser:
    enabled: false
    image:
      repository: ghcr.io/browserless/chromium
      digest: "sha256:b1ba7b054af2891a8199f884d4bd249cf8c3bd2fa8a97b339077e40f92803ba8"
      pullPolicy: IfNotPresent
    # REQUIRED when enabled: the Secret (created by an ExternalSecret from Vault
    # <prefix>/masi-browser, property token) holding browserless's TOKEN. Without a token
    # browserless serves CDP to anyone who reaches :3000 — including a page it renders,
    # over loopback, which no NetworkPolicy can see; from there Envoy's admin port is one
    # request away. masi sends the same token on every connect.
    existingSecret: ""
    # Sessions the server itself runs at once (a third gets 429) and masi's run deadline
    # (MASI_BROWSER_RUN_DEADLINE_MS); browserless's own TIMEOUT is this plus 60 s so the
    # run is always ended by masi, not by the pod mid-navigation.
    maxParallel: 2
    timeoutMs: 600000
    # /dev/shm as a memory emptyDir: Kubernetes' default 64 MiB crashes renderers.
    shmSize: 512Mi
    resources:
      requests: { memory: "512Mi", cpu: "100m" }
      limits: { memory: "2Gi", cpu: "2000m", ephemeral-storage: "2Gi" }


chat:
  e2eEnabled: false

captcha:
  enabled: true

chess:
  enabled: false

# Cross-chart references (for secret/service name resolution and configmap)
postgres:
  database: monitor
valkey: {}
minio: {}
alertmanager: {}
kafka:
  enabled: true
strimzi:
  enabled: false
cnpg:
  enabled: false
scyllaOperator:
  enabled: false
keycloak:
  enabled: false
  hostname: auth.pmon.dev
  clients:
    adminService:
      enabled: false
# Distributed tracing (OTLP → Tempo)
tracing:
  enabled: false
  # HTTP/protobuf OTLP (port 4318). gRPC was tested but its SDK sender
  # is also OkHttp-based, so the readTimeout bug applies equally.
  # The actual fix is the build.gradle swap from
  # opentelemetry-exporter-sender-okhttp to -sender-jdk; see app
  # repos. HTTP wins on debug-ability at our trace volume.
  tempoEndpoint: "http://schnappy-tempo.schnappy-infra.svc:4318/v1/traces"
  tempoTransport: "http"
  samplingProbability: "0.1"
  exporterTimeout: "30s"
  exporterConnectTimeout: "30s"
  # BatchSpanProcessor schedule delay (was 5s default). Smaller value
  # → more frequent, smaller batches → lower per-export latency.
  scheduleDelay: "1s"

# k6 smoke test, run as an Argo PostSync hook Job after every sync.
# (The scheduled CronJob variant lives in the schnappy-test chart.)
smokeTest:
  enabled: true
  image: grafana/k6:1.7.1
  baseUrl: ""                # Defaults to https://<app.ingress.host>
  clientSecretName: ""       # k8s Secret with CLIENT_SECRET key (for authenticated tests)
  # k6 remote-write target; empty disables the output. Plain HTTP by design:
  # in-cluster ClusterIP, the k6 pod runs without a sidecar.
  prometheusRwUrl: http://schnappy-mimir.schnappy-infra.svc:9009/api/v1/push
  # Extra script groups to skip; admin/chat/chess groups are skipped automatically
  # when the corresponding service is disabled in this release.
  skipGroups: []
# Hyperfoil load/stress tests (bypass Envoy, hit backends directly)
hyperfoil:
  enabled: false
  image: git.pmon.dev/schnappy/hyperfoil:latest
  reportsUrl: ""             # URL for report links in logs (e.g. https://reports.pmon.dev)
  clientSecretName: ""       # ExternalSecret name for Keycloak service account
  load:
    schedule: "0 3 * * *"

scylla:
  enabled: true
  datacenter: datacenter1
  keyspace: chat

# admin mints Centrifugo channel subscription tokens. Enable per-env
# where the schnappy-realtime chart is deployed.
realtime:
  enabled: false
  # Override if the centrifugo Secret name differs from the convention
  # `<schnappy.fullname>-centrifugo`. Empty → use the default helper.
  existingSecret: ""
