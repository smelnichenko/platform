{{- if or (and (eq (.Values.scylla.enabled | toString) "true") (gt (int .Values.scylla.replicas) 0)) (eq (.Values.scyllaOperator.enabled | toString) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.scylla.serviceName" . }}-schema
  labels:
    {{- include "schnappy.scylla.labels" . | nindent 4 }}
  annotations:
    # Sync hook, like cnpg-init-users.yaml: a plain synced Job cannot be updated once its
    # spec.template changes (an image bump did exactly that), and BeforeHookCreation
    # replaces the previous run — including the pre-hook plain Job of the same name.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 10
  # bounded: Argo waits for a hook until Kubernetes fails the Job - ten tries' backoff ran 35 min and more
  activeDeadlineSeconds: 1200
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: scylla-job
        velero.io/exclude-from-backup: "true"
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "schnappy.fullname" . }}-scylla
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scylla-schema
          image: {{ .Values.scylla.image }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for ScyllaDB to be ready..."
              # bounded by the clock: a Scylla that never answers fails the try (the Job retries, its deadline holds)
              end=$(( $(date +%s) + 300 ))
              for i in $(seq 1 1000); do
                cqlsh --connect-timeout=5 --request-timeout=10 {{ include "schnappy.scylla.serviceName" . }} 9042 -e "SELECT now() FROM system.local" 2>/dev/null && break
                [ "$(date +%s)" -lt "$end" ] || { echo "ScyllaDB not ready after 300s"; exit 1; }
                echo "ScyllaDB not ready, retrying in 5s..."
                sleep 5
              done
              echo "ScyllaDB is ready. Applying schema..."
              cqlsh --connect-timeout=5 --request-timeout=60 {{ include "schnappy.scylla.serviceName" . }} 9042 <<'EOF'
{{ regexReplaceAll "(?m)^ +$" (.Files.Get "files/scylla-schema.cql" | trimSuffix "\n" | indent 14) "" }}
              EOF
              echo "Migrating user_id to user_uuid if needed..."
              # a column that exists already is the only failure taken: a time-out or any other error fails the hook
              if ! out=$(cqlsh --connect-timeout=5 --request-timeout=60 {{ include "schnappy.scylla.serviceName" . }} 9042 -e "ALTER TABLE chat.messages_by_channel ADD user_uuid uuid;" 2>&1); then
                case $out in *"conflicts with an existing column"* | *"already exists"*) ;; *) echo "$out"; exit 1 ;; esac
              fi
              # a column that exists already is the only failure taken: a time-out or any other error fails the hook
              if ! out=$(cqlsh --connect-timeout=5 --request-timeout=60 {{ include "schnappy.scylla.serviceName" . }} 9042 -e "ALTER TABLE chat.message_edits ADD user_uuid uuid;" 2>&1); then
                case $out in *"conflicts with an existing column"* | *"already exists"*) ;; *) echo "$out"; exit 1 ;; esac
              fi
              echo "Schema applied successfully."
              echo "Done."
      restartPolicy: OnFailure
{{- end }}
