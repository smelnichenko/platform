{{- if eq (.Values.s3gw.enabled | toString) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-s3gw-buckets
  labels:
    {{- include "schnappy.s3gw.labels" . | nindent 4 }}
  annotations:
    # Run as a Sync hook so Argo owns this Job's lifecycle and creates a fresh one
    # each sync (hook-delete-policy BeforeHookCreation deletes the prior run first).
    # A plain synced Job can't be updated (immutable spec.template), and Replace=true
    # captures the Job's k8s-generated selector/controller-uid and then fails to
    # re-apply them ("selector not auto-generated"). A hook Job sidesteps both.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 120
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "schnappy.s3gw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: s3gw-buckets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "schnappy.fullname" . }}-s3gw
      containers:
        - name: create-buckets
          # AWS's own CLI, not MinIO's mc: MinIO withdrew the mc images on 2026-09-24 (quay.io 401, docker.io
          # gone). aws-cli, unlike rclone, also sets the bucket policy a public-read bucket needs.
          image: amazon/aws-cli:2.37.1@sha256:b0dd5a4d216a1786863541a201baa7b7b4c5032bec9c6e72c38d01cafd7e8db8
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              s3() { aws --endpoint-url "http://{{ include "schnappy.fullname" . }}-s3gw:9000" s3api "$@"; }
              {{- range .Values.s3gw.buckets }}
              s3 head-bucket --bucket {{ . }} >/dev/null 2>&1 || s3 create-bucket --bucket {{ . }} >/dev/null
              {{- end }}
              {{- range .Values.s3gw.publicReadBuckets }}
              # anonymous GET and LIST on this bucket only; writes still need the credentials
              cat > /tmp/policy.json <<'POLICY'
              {"Version":"2012-10-17","Statement":[
               {"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetBucketLocation","s3:ListBucket"],"Resource":["arn:aws:s3:::{{ . }}"]},
               {"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::{{ . }}/*"]}]}
              POLICY
              s3 put-bucket-policy --bucket {{ . }} --policy file:///tmp/policy.json
              {{- end }}
              aws --endpoint-url "http://{{ include "schnappy.fullname" . }}-s3gw:9000" s3 ls
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.s3gw.secretName" . }}
                  key: ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.s3gw.secretName" . }}
                  key: SECRET_KEY
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
