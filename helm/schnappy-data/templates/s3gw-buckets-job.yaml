{{- if eq (.Values.s3gw.enabled | toString) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-s3gw-buckets
  labels:
    {{- include "schnappy.s3gw.labels" . | nindent 4 }}
  annotations:
    # Run as a Sync hook so Argo owns this Job's lifecycle and creates a fresh one
    # each sync (hook-delete-policy BeforeHookCreation deletes the prior run first).
    # A plain synced Job can't be updated (immutable spec.template), and Replace=true
    # captures the Job's k8s-generated selector/controller-uid and then fails to
    # re-apply them ("selector not auto-generated"). A hook Job sidesteps both.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 120
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "schnappy.s3gw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: s3gw-buckets
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "schnappy.fullname" . }}-s3gw
      containers:
        - name: create-buckets
          # rclone, not MinIO's mc: MinIO withdrew the mc images on 2026-09-24 (quay.io 401, docker.io gone)
          image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              {{- range .Values.s3gw.buckets }}
              rclone mkdir s3gw:{{ . }}
              {{- end }}
              rclone lsd s3gw:
          env:
            # the remote "s3gw" is configured by environment alone: no config file on the read-only root
            - name: RCLONE_CONFIG
              value: ""
            - name: RCLONE_CONFIG_S3GW_TYPE
              value: s3
            - name: RCLONE_CONFIG_S3GW_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_S3GW_ENDPOINT
              value: http://{{ include "schnappy.fullname" . }}-s3gw:9000
            - name: HOME
              value: /tmp
            - name: RCLONE_CONFIG_S3GW_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.s3gw.secretName" . }}
                  key: ACCESS_KEY
            - name: RCLONE_CONFIG_S3GW_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.s3gw.secretName" . }}
                  key: SECRET_KEY
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
