{{- if and (eq (.Values.cnpg.enabled | toString) "true") .Values.cnpg.backup }}
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ include "schnappy.postgres.serviceName" . }}-daily
  labels:
    {{- include "schnappy.postgres.labels" . | nindent 4 }}
spec:
  # CNPG's schedule has a seconds field first: 01:30:00 every day (the 5-field "30 1 * * *" ran at second 30 of minute
  # 1 of every hour - an hourly base backup in production from 2026-04 to 2026-10; .woodpecker/cnpg-backup-render.sh)
  schedule: "0 30 1 * * *"
  backupOwnerReference: cluster
  cluster:
    name: {{ include "schnappy.postgres.serviceName" . }}
{{- end }}
