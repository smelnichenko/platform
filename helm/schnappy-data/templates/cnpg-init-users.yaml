{{- if and (eq (.Values.cnpg.enabled | toString) "true") .Values.postgres.databases }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.postgres.serviceName" . }}-init-users
  labels:
    {{- include "schnappy.postgres.labels" . | nindent 4 }}
  annotations:
    # Run as a Sync hook so Argo owns this Job's lifecycle and creates a fresh one
    # each sync (hook-delete-policy BeforeHookCreation deletes the prior run first,
    # including the pre-hook plain Job of the same name). A plain synced Job cannot
    # be updated once its spec.template changes — and adding a database to
    # postgres.databases changes it — and the `sync-options: Delete=true` it used
    # to carry is merely Argo's default, so it guarded nothing. The script is
    # idempotent (IF NOT EXISTS / ALTER) and fails on its own errors, so a re-run
    # on every sync is harmless and "Succeeded" means every role and database
    # exists. Same pattern as s3gw-buckets-job.yaml.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-init-users
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: init-users
          image: postgres:17-alpine
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PGHOST
              value: {{ include "schnappy.postgres.serviceName" . }}-rw
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.postgres.serviceName" . }}-superuser
                  key: password
            {{- range .Values.postgres.databases }}
            - name: DB_PASSWORD_{{ .name | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" $ }}-postgres-{{ .name }}
                  key: DB_PASSWORD
            {{- end }}
          command: ["sh", "-c"]
          # kubelet rewrites container args before the shell sees them: a double
          # dollar becomes a single one (its escape inside env-var expansion), so
          # the script never contains one — not even in a comment. CI extracts the
          # script, applies the same rewrite and runs it against a real Postgres.
          args:
            - |
              set -eu
              echo "Waiting for PostgreSQL..."
              until psql -c "SELECT 1" >/dev/null 2>&1; do
                echo "Not ready, retrying in 3s..."
                sleep 3
              done
              echo "PostgreSQL is ready. Creating per-service users and databases..."
              # As a Sync hook, "Succeeded" must mean every role and database exists:
              # set -e plus ON_ERROR_STOP (no swallowed errors), an existence check
              # instead of a create-or-alter guess, the password passed as a psql
              # variable through stdin (psql does NOT interpolate :'var' inside -c;
              # a quote in the value cannot break the SQL) and ${VAR:?} so a missing
              # secret aborts instead of setting an empty password. The DO block is
              # dollar-quoted with a tag: see the note above `args` about kubelet.
              {{- range .Values.postgres.databases }}

              # --- {{ .name }} ---
              psql -v ON_ERROR_STOP=1 -v pw="${DB_PASSWORD_{{ .name | upper }}:?}" <<'SQL'
              DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .name }}') THEN CREATE ROLE {{ .name }} LOGIN; END IF; END $do$;
              ALTER ROLE {{ .name }} PASSWORD :'pw';
              SQL
              psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ .name }}'" | grep -q 1 || psql -c "CREATE DATABASE {{ .name }} OWNER {{ .name }};"
              psql -c "ALTER DATABASE {{ .name }} OWNER TO {{ .name }};"
              {{- end }}

              echo "Per-service users and databases configured."
              wget -qO- --post-data= http://localhost:15020/quitquitquit || true
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
