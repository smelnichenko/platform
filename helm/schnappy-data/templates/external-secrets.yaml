{{- if .Values.vault.secretsEnabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.postgres.secretName" . }}
  labels:
    {{- include "schnappy.postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.postgres.secretName" . }}
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/postgres
        property: database
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/postgres
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/postgres
        property: password
{{- range .Values.postgres.databases }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.fullname" $ }}-postgres-{{ .name }}
  labels:
    {{- include "schnappy.postgres.labels" $ | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.fullname" $ }}-postgres-{{ .name }}
  data:
    - secretKey: DB_NAME
      remoteRef:
        key: {{ $.Values.vault.secretPathPrefix }}/postgres-{{ .name }}
        property: database
    - secretKey: DB_USERNAME
      remoteRef:
        key: {{ $.Values.vault.secretPathPrefix }}/postgres-{{ .name }}
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ $.Values.vault.secretPathPrefix }}/postgres-{{ .name }}
        property: password
{{- end }}
{{- if or .Values.valkey.password .Values.valkey.existingSecret }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.valkey.secretName" . }}
  labels:
    {{- include "schnappy.valkey.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.valkey.secretName" . }}
  data:
    - secretKey: VALKEY_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/valkey
        property: password
{{- end }}
{{- /* Legacy shared S3 credentials secret — pinned to s3gw.existingSecret directly
       (not the schnappy.s3gw.secretName helper) so it keeps being produced while
       consumers migrate to the renamed secret (newSecretName, ACCESS_KEY/SECRET_KEY).
       Removed once every consumer reads the new secret. */}}
{{- if eq (.Values.s3gw.enabled | toString) "true" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.s3gw.existingSecret }}
  labels:
    {{- include "schnappy.s3gw.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.s3gw.existingSecret }}
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/minio
        property: access_key
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/minio
        property: secret_key
{{- end }}
{{- /* Wave-5 transitional: the renamed S3 credentials secret (new k8s name +
       neutral ACCESS_KEY/SECRET_KEY keys, same Vault creds). Consumers flip to this,
       then the old schnappy-*-minio ExternalSecret/secret is removed and this
       becomes the only one. Set s3gw.newSecretName per-env to enable. */}}
{{- if and (eq (.Values.s3gw.enabled | toString) "true") .Values.s3gw.newSecretName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.s3gw.newSecretName }}
  labels:
    {{- include "schnappy.s3gw.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ .Values.s3gw.newSecretName }}
  data:
    - secretKey: ACCESS_KEY
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/minio
        property: access_key
    - secretKey: SECRET_KEY
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/minio
        property: secret_key
{{- end }}
{{- if eq (.Values.strimzi.enabled | toString) "true" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "schnappy.kafka.secretName" . }}
  labels:
    {{- include "schnappy.kafka.labels" . | nindent 4 }}
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "schnappy.kafka.secretName" . }}
  data:
    - secretKey: KAFKA_CLUSTER_ID
      remoteRef:
        key: {{ .Values.vault.secretPathPrefix }}/kafka
        property: cluster_id
{{- end }}
{{- end }}
