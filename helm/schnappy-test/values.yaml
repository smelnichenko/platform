smokeTest:
  enabled: false
  # by digest as well as tag (a Docker Hub tag can move): Renovate moves both
  image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
  schedule: "0 6 * * *"
  # true = never fires on its own; still runnable via `kubectl create job --from=cronjob/...`
  suspend: false
  baseUrl: https://pmon.dev
  keycloakUrl: https://auth.pmon.dev
  clientSecretName: schnappy-k6-smoke
  # Prometheus remote-write target for k6 metrics; empty disables the output.
  # Plain HTTP by design: in-cluster ClusterIP, the k6 pod runs without a sidecar.
  prometheusRwUrl: http://schnappy-mimir.schnappy-infra.svc:9009/api/v1/push
  # Script groups to skip (e.g. services not deployed in this environment). The shared
  # smoke script has a `masi` group (/api/masi/jobs); this chart cannot see whether the
  # target runs masi, so drop the entry only once masi is served at baseUrl.
  skipGroups: [masi]

vault:
  secretsEnabled: false
  secretPathPrefix: "secret/data/schnappy"
