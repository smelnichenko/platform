{{- if and (eq (.Values.sonarqube.enabled | toString) "true") (eq (.Values.sonarqube.setup.enabled | toString) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  # bounded: Argo waits for a hook until Kubernetes fails the Job - its 40 minutes of waiting (a database migration),
  # its revoke's 30 s, 120 s, and 10 s for each of its calls: 24, and 3 a project (chart-render-checks counts the rendered ones)
  activeDeadlineSeconds: {{ add 2550 (mul 10 (add 24 (mul 3 (len .Values.sonarqube.setup.projects)))) }}
  template:
    metadata:
      labels:
        {{- include "schnappy.sonarqube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: schnappy
        app.kubernetes.io/component: sonarqube-setup
        velero.io/exclude-from-backup: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "schnappy.fullname" . }}-sonarqube-setup
      containers:
        - name: setup
          image: curlimages/curl:8.12.1
          env:
            - name: SQ_URL
              value: "http://{{ include "schnappy.sonarqube.serviceName" . }}:9000"
            - name: SQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.sonarqube.secretName" . }}
                  key: SONARQUBE_ADMIN_PASSWORD
            - name: VAULT_ADDR
              value: {{ .Values.sonarqube.setup.vaultAddr | default "https://192.168.11.5:8200" | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" . }}-vault-token
                  key: token
          command:
            - /bin/sh
            - -c
            - |
{{ regexReplaceAll "(?m)^ +$" (tpl (.Files.Get "files/setup.sh") . | trimSuffix "\n" | indent 14) "" }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- end }}
