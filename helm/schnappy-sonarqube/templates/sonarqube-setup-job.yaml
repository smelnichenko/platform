{{- if and (eq (.Values.sonarqube.enabled | toString) "true") (eq (.Values.sonarqube.setup.enabled | toString) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  # bounded: Argo waits for a hook until Kubernetes fails the Job - its 40 minutes of waiting (a database migration),
  # its revoke's 30 s, 120 s, and 10 s for each of its calls: 24, and 3 a project (chart-render-checks counts the rendered ones)
  activeDeadlineSeconds: {{ add 2550 (mul 10 (add 24 (mul 3 (len .Values.sonarqube.setup.projects)))) }}
  template:
    metadata:
      labels:
        {{- include "schnappy.sonarqube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: schnappy
        app.kubernetes.io/component: sonarqube-setup
        velero.io/exclude-from-backup: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "schnappy.fullname" . }}-sonarqube-setup
      containers:
        - name: setup
          image: curlimages/curl:8.12.1
          env:
            - name: SQ_URL
              value: "http://{{ include "schnappy.sonarqube.serviceName" . }}:9000"
            - name: SQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.sonarqube.secretName" . }}
                  key: SONARQUBE_ADMIN_PASSWORD
            - name: VAULT_ADDR
              value: {{ .Values.sonarqube.setup.vaultAddr | default "https://192.168.11.5:8200" | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" . }}-vault-token
                  key: token
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # a token generated and not confirmed in Vault is revoked whatever ends the run (a time-out, a failed write, a TERM
              # from the Job's deadline or an eviction): an existing token is never written again, so the next run must find none
              # and make one. A generate that timed out here may still commit after the first revoke: revoked and searched again
              # until none is left, 30 s at most. The sidecar is told to quit on success only: a failed try is restarted in this
              # pod (OnFailure) and reaches nothing once its proxy is gone
              UNWRITTEN=""
              on_exit() {
                rc=$?
                if [ -n "$UNWRITTEN" ]; then
                  [ "$rc" != 0 ] || rc=1
                  GONE=""
                  end=$(( $(date +%s) + 30 ))
                  for i in $(seq 1 100); do
                    sq -X POST "${SQ_URL}/api/user_tokens/revoke" -d "name=ci" > /dev/null || true
                    if LEFT=$(sq "${SQ_URL}/api/user_tokens/search") && ! echo "$LEFT" | grep -q '"name":"ci"'; then GONE=yes; break; fi
                    [ "$(date +%s)" -lt "$end" ] || break
                    sleep 3
                  done
                  [ -n "$GONE" ] || echo "ERROR: revoking 'ci' failed (none made, or revoke it by hand)"
                fi
                [ "$rc" != 0 ] || curl -sf --max-time 5 -X POST http://localhost:15020/quitquitquit > /dev/null 2>&1 || true
                exit "$rc"
              }
              trap on_exit EXIT
              # PID 1 ignores a TERM it has no handler for: the deadline's or an eviction's TERM then never runs on_exit
              trap 'exit 143' TERM

              # every call fails on an HTTP error and on its time-out (-f, --max-time) and every answer is read into a
              # variable before it is searched: a failed read is a failure, never "absent" (a create after it would
              # say "created" with nothing done)
              sq() { curl -fsS --max-time 10 -u "admin:${SQ_ADMIN_PASSWORD}" "$@"; }

              # 1. Wait for SonarQube to be ready - up to 40 minutes: a new version first migrates its database. It waits in
              #    DB_MIGRATION_NEEDED until someone starts the migration - what the /setup page does, POST api/system/migrate_db:
              #    started here (unauthenticated, as /setup; refused that way, as admin), once. Every pass that is not UP reads the
              #    migration's state first: one running (this Job's earlier container started it) is never started again, and one
              #    that failed ends the wait at once - SonarQube then stays DOWN, never UP. A start nobody answered is read again
              #    on the next pass, never started blind a second time
              migration_state() {  # the migration's state as SonarQube says it (MIGRATION_RUNNING, MIGRATION_FAILED, ...), or none
                curl -sS --max-time 10 "${SQ_URL}/api/system/db_migration_status" 2>/dev/null \
                  | grep -o '"state":"[^"]*"' | cut -d'"' -f4 || true
              }
              start_migration() {  # start_migration [-u <user:password>]: its answer's state, or "HTTP <code>" (000: no answer)
                ANSWER=$(curl -sS --max-time 10 "$@" -w '\n%{http_code}' -X POST "${SQ_URL}/api/system/migrate_db") || ANSWER="
              000"
                CODE=$(echo "$ANSWER" | tail -1)
                STARTED_STATE=$(echo "$ANSWER" | grep -o '"state":"[^"]*"' | cut -d'"' -f4 || true)
                if [ "$CODE" = 200 ] && [ -n "$STARTED_STATE" ]; then echo "$STARTED_STATE"; else echo "HTTP $CODE"; fi
              }
              echo "Waiting for SonarQube..."
              end=$(( $(date +%s) + 2400 ))
              MIGRATION=""
              STARTED=""
              for i in $(seq 1 1000); do
                STATUS=$(curl -sf --max-time 5 "${SQ_URL}/api/system/status" 2>/dev/null | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                [ "$STATUS" = "UP" ] && break
                STATE=$(migration_state)
                case $STATE in
                  MIGRATION_FAILED) echo "ERROR: the database migration failed - SonarQube's log says why"; exit 1 ;;
                  MIGRATION_RUNNING) [ -n "$MIGRATION" ] || echo "Database migration running"; MIGRATION=seen ;;
                esac
                if [ "$STATUS" = "DB_MIGRATION_NEEDED" ] && [ "$STATE" != MIGRATION_RUNNING ] && [ -z "$STARTED" ]; then
                  ANSWER=$(start_migration)
                  case $ANSWER in "HTTP 401" | "HTTP 403") ANSWER=$(start_migration -u "admin:${SQ_ADMIN_PASSWORD}") ;; esac
                  case $ANSWER in
                    MIGRATION_RUNNING | MIGRATION_SUCCEEDED) echo "Database migration started"; STARTED=yes; MIGRATION=seen ;;
                    "HTTP 000") echo "Database migration start not answered - its state read again" ;;
                    *) echo "ERROR: database migration not started ($ANSWER)"; exit 1 ;;
                  esac
                fi
                [ "$(date +%s)" -lt "$end" ] || break
                sleep 5
              done
              [ "$STATUS" != "UP" ] && echo "ERROR: SonarQube not ready after 40 minutes (status ${STATUS:-none})" && exit 1
              echo "SonarQube is UP${MIGRATION:+ (its database migrated)}"

              # 2. Change admin password (if still default)
              DEFAULT_CHECK=$(curl -fsS --max-time 10 -u "admin:admin" "${SQ_URL}/api/authentication/validate")
              if echo "$DEFAULT_CHECK" | grep -q '"valid":true'; then
                echo "Changing default admin password..."
                curl -fsS --max-time 10 -X POST -u "admin:admin" "${SQ_URL}/api/users/change_password" \
                  -d "login=admin&previousPassword=admin&password=${SQ_ADMIN_PASSWORD}"
                echo "Admin password changed"
              else
                echo "Admin password already set"
              fi

              # 3. Generate analysis token (if not exists); one generated is revoked unless Vault confirms it (on_exit)
              TOKENS=$(sq "${SQ_URL}/api/user_tokens/search")
              if ! echo "$TOKENS" | grep -q '"name":"ci"'; then
                echo "Generating analysis token..."
                UNWRITTEN=yes  # armed before the call: one timing out may have made the token all the same
                GENERATED=$(sq -X POST "${SQ_URL}/api/user_tokens/generate" -d "name=ci&type=USER_TOKEN")
                TOKEN=$(echo "$GENERATED" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
                [ -n "$TOKEN" ] || { echo "ERROR: token generation answered no token"; exit 1; }
                echo "Token generated, writing to Vault..."
                VAULT_RESP=$(curl -fsSk --max-time 10 -X PATCH \
                  -H "X-Vault-Token: ${VAULT_TOKEN}" \
                  -H "Content-Type: application/merge-patch+json" \
                  "${VAULT_ADDR}/v1/{{ .Values.vault.secretPathPrefix }}/woodpecker-ci" \
                  -d "{\"data\":{\"sonar_token\":\"${TOKEN}\"}}")
                echo "$VAULT_RESP" | grep -q '"version"' || { echo "ERROR: Vault did not confirm the token: $VAULT_RESP"; exit 1; }
                UNWRITTEN=""
                echo "Token written to Vault successfully"
              else
                echo "Analysis token already exists"
              fi

              # 4. Quality gates: made when missing, then set every run - a run that failed between the copy and its settings left a
              # gate a later run must still finish
              GATES=$(sq "${SQ_URL}/api/qualitygates/list")
              # Service gate (default, 80% coverage)
              if ! echo "$GATES" | grep -q '"name":"Service"'; then
                echo "Creating Service quality gate..."
                sq -X POST "${SQ_URL}/api/qualitygates/copy" -d "sourceName=Sonar%20way&name=Service" > /dev/null
              fi
              sq -X POST "${SQ_URL}/api/qualitygates/set_as_default" -d "name=Service" > /dev/null
              echo "Service gate in place, the default"

              # Frontend gate (70% coverage)
              if ! echo "$GATES" | grep -q '"name":"Frontend"'; then
                echo "Creating Frontend quality gate..."
                sq -X POST "${SQ_URL}/api/qualitygates/copy" -d "sourceName=Sonar%20way&name=Frontend" > /dev/null
              fi
              GATE=$(sq "${SQ_URL}/api/qualitygates/show?name=Frontend")
              COV_ID=$(echo "$GATE" | grep -o '"id":"[^"]*","metric":"new_coverage"' | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
              [ -n "$COV_ID" ] || { echo "ERROR: the Frontend gate has no new_coverage condition to set to 70%"; exit 1; }
              sq -X POST "${SQ_URL}/api/qualitygates/update_condition" \
                -d "id=${COV_ID}&metric=new_coverage&op=LT&error=70" > /dev/null
              echo "Frontend gate in place (70% coverage)"

              # 5. Create projects
              {{- range .Values.sonarqube.setup.projects }}
              FOUND=$(sq "${SQ_URL}/api/projects/search?q={{ .key }}")
              if ! echo "$FOUND" | grep -q '"key":"{{ .key }}"'; then
                sq -X POST "${SQ_URL}/api/projects/create" \
                  -d "project={{ .key }}&name={{ .name | replace " " "%20" }}&visibility=private" > /dev/null
                echo "Created project: {{ .key }}"
              else
                echo "Project exists: {{ .key }}"
              fi
              {{- if .gate }}
              sq -X POST "${SQ_URL}/api/qualitygates/select" -d "gateName={{ .gate }}&projectKey={{ .key }}" > /dev/null
              {{- end }}
              {{- end }}

              echo "SonarQube setup complete"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- end }}
