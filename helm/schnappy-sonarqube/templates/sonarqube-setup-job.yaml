{{- if and (eq (.Values.sonarqube.enabled | toString) "true") (eq (.Values.sonarqube.setup.enabled | toString) "true") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  # bounded: Argo waits for a hook until Kubernetes fails the Job - its 600 s wait and the setup calls, each bounded
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        {{- include "schnappy.sonarqube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: schnappy
        app.kubernetes.io/component: sonarqube-setup
        velero.io/exclude-from-backup: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "schnappy.fullname" . }}-sonarqube-setup
      containers:
        - name: setup
          image: curlimages/curl:8.12.1
          env:
            - name: SQ_URL
              value: "http://{{ include "schnappy.sonarqube.serviceName" . }}:9000"
            - name: SQ_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.sonarqube.secretName" . }}
                  key: SONARQUBE_ADMIN_PASSWORD
            - name: VAULT_ADDR
              value: {{ .Values.sonarqube.setup.vaultAddr | default "https://192.168.11.5:8200" | quote }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.fullname" . }}-vault-token
                  key: token
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              # the sidecar told to quit whatever the outcome; the Job's status is the script's
              trap 'curl -sf --max-time 5 -X POST http://localhost:15020/quitquitquit > /dev/null 2>&1 || true' EXIT

              # every call fails on an HTTP error and on its time-out (-f, --max-time) and every answer is read into a
              # variable before it is searched: a failed read is a failure, never "absent" (a create after it would
              # say "created" with nothing done)
              sq() { curl -fsS --max-time 10 -u "admin:${SQ_ADMIN_PASSWORD}" "$@"; }

              # 1. Wait for SonarQube to be ready
              echo "Waiting for SonarQube..."
              end=$(( $(date +%s) + 600 ))
              for i in $(seq 1 1000); do
                STATUS=$(curl -sf --max-time 5 "${SQ_URL}/api/system/status" 2>/dev/null | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                [ "$STATUS" = "UP" ] && break
                [ "$(date +%s)" -lt "$end" ] || break
                sleep 5
              done
              [ "$STATUS" != "UP" ] && echo "ERROR: SonarQube not ready after 10 minutes" && exit 1
              echo "SonarQube is UP"

              # 2. Change admin password (if still default)
              DEFAULT_CHECK=$(curl -fsS --max-time 10 -u "admin:admin" "${SQ_URL}/api/authentication/validate")
              if echo "$DEFAULT_CHECK" | grep -q '"valid":true'; then
                echo "Changing default admin password..."
                curl -fsS --max-time 10 -X POST -u "admin:admin" "${SQ_URL}/api/users/change_password" \
                  -d "login=admin&previousPassword=admin&password=${SQ_ADMIN_PASSWORD}"
                echo "Admin password changed"
              else
                echo "Admin password already set"
              fi

              # 3. Generate analysis token (if not exists). A token Vault never got is revoked: an existing one is
              # never written again, so the next run must make a new one
              TOKENS=$(sq "${SQ_URL}/api/user_tokens/search")
              if ! echo "$TOKENS" | grep -q '"name":"ci"'; then
                echo "Generating analysis token..."
                GENERATED=$(sq -X POST "${SQ_URL}/api/user_tokens/generate" -d "name=ci&type=USER_TOKEN")
                TOKEN=$(echo "$GENERATED" | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
                [ -n "$TOKEN" ] || { echo "ERROR: token generation answered no token"; exit 1; }
                echo "Token generated, writing to Vault..."
                VAULT_RESP=""
                if VAULT_RESP=$(curl -fsSk --max-time 10 -X PATCH \
                    -H "X-Vault-Token: ${VAULT_TOKEN}" \
                    -H "Content-Type: application/merge-patch+json" \
                    "${VAULT_ADDR}/v1/{{ .Values.vault.secretPathPrefix }}/woodpecker-ci" \
                    -d "{\"data\":{\"sonar_token\":\"${TOKEN}\"}}") && echo "$VAULT_RESP" | grep -q '"version"'; then
                  echo "Token written to Vault successfully"
                else
                  sq -X POST "${SQ_URL}/api/user_tokens/revoke" -d "name=ci" > /dev/null \
                    || echo "ERROR: revoking the unwritten token failed too - revoke 'ci' by hand"
                  echo "ERROR: writing the token to Vault failed: ${VAULT_RESP:-no answer}"
                  exit 1
                fi
              else
                echo "Analysis token already exists"
              fi

              # 4. Create quality gates
              GATES=$(sq "${SQ_URL}/api/qualitygates/list")
              # Service gate (default, 80% coverage)
              if ! echo "$GATES" | grep -q '"name":"Service"'; then
                echo "Creating Service quality gate..."
                sq -X POST "${SQ_URL}/api/qualitygates/copy" -d "sourceName=Sonar%20way&name=Service" > /dev/null
                sq -X POST "${SQ_URL}/api/qualitygates/set_as_default" -d "name=Service" > /dev/null
                echo "Service gate created and set as default"
              else
                echo "Service gate already exists"
              fi

              # Frontend gate (70% coverage)
              if ! echo "$GATES" | grep -q '"name":"Frontend"'; then
                echo "Creating Frontend quality gate..."
                sq -X POST "${SQ_URL}/api/qualitygates/copy" -d "sourceName=Sonar%20way&name=Frontend" > /dev/null
                GATE=$(sq "${SQ_URL}/api/qualitygates/show?name=Frontend")
                COV_ID=$(echo "$GATE" | grep -o '"id":"[^"]*","metric":"new_coverage"' | grep -o '"id":"[^"]*"' | cut -d'"' -f4)
                [ -n "$COV_ID" ] || { echo "ERROR: the Frontend gate has no new_coverage condition to set to 70%"; exit 1; }
                sq -X POST "${SQ_URL}/api/qualitygates/update_condition" \
                  -d "id=${COV_ID}&metric=new_coverage&op=LT&error=70" > /dev/null
                echo "Frontend gate created (70% coverage)"
              else
                echo "Frontend gate already exists"
              fi

              # 5. Create projects
              {{- range .Values.sonarqube.setup.projects }}
              FOUND=$(sq "${SQ_URL}/api/projects/search?q={{ .key }}")
              if ! echo "$FOUND" | grep -q '"key":"{{ .key }}"'; then
                sq -X POST "${SQ_URL}/api/projects/create" \
                  -d "project={{ .key }}&name={{ .name | replace " " "%20" }}&visibility=private" > /dev/null
                echo "Created project: {{ .key }}"
              else
                echo "Project exists: {{ .key }}"
              fi
              {{- if .gate }}
              sq -X POST "${SQ_URL}/api/qualitygates/select" -d "gateName={{ .gate }}&projectKey={{ .key }}" > /dev/null
              {{- end }}
              {{- end }}

              echo "SonarQube setup complete"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
{{- end }}
