{{- if eq (.Values.sonarqube.enabled | toString) "true" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "schnappy.sonarqube.serviceName" . }}-data
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
  annotations:
    # local-path's volume goes with its claim: Argo never prunes or deletes this one, whatever its application's policy
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.sonarqube.storage.storageClass }}
  storageClassName: {{ .Values.sonarqube.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sonarqube.storage.size }}
{{- end }}
