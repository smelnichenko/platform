{{- if and .Values.networkPolicies.enabled (eq (.Values.sonarqube.enabled | toString) "true") }}
# SonarQube network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube
  labels:
    {{- include "schnappy.sonarqube.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "schnappy.sonarqube.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller (Traefik)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 9000
    # Allow from Woodpecker CI pipeline pods (sonar analysis)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: woodpecker
      ports:
        - protocol: TCP
          port: 9000
    {{- if eq (.Values.sonarqube.setup.enabled | toString) "true" }}
    # Allow from setup job
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sonarqube-setup
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # SonarQube → its PostgreSQL (the StatefulSet's, and CNPG's cluster's)
    - to:
        - podSelector:
            matchLabels:
              {{- include "schnappy.sonarqube.postgres.selectorLabels" . | nindent 14 }}
        {{- if eq (.Values.sonarqube.cnpg.enabled | toString) "true" }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "schnappy.sonarqube.cnpg.name" . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
---
# SonarQube PostgreSQL network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-postgres
  labels:
    {{- include "schnappy.sonarqube.postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "schnappy.sonarqube.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from SonarQube - and CNPG's cluster, its import reading the database once
    - from:
        - podSelector:
            matchLabels:
              {{- include "schnappy.sonarqube.selectorLabels" . | nindent 14 }}
        {{- if and (eq (.Values.sonarqube.cnpg.enabled | toString) "true") .Values.sonarqube.cnpg.import }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "schnappy.sonarqube.cnpg.name" . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- if eq (.Values.sonarqube.setup.enabled | toString) "true" }}
---
# SonarQube setup job network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "schnappy.fullname" . }}-sonarqube-setup
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "schnappy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sonarqube-setup
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Setup job → SonarQube
    - to:
        - podSelector:
            matchLabels:
              {{- include "schnappy.sonarqube.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
{{- if eq (.Values.sonarqube.cnpg.enabled | toString) "true" }}
---
# SonarQube's CNPG cluster: SonarQube in, the operator in, its own pods; out to DNS, the Kubernetes API (leader
# election, status), the StatefulSet while it imports, the Pi backup store when backed up - as production's cluster's
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "schnappy.sonarqube.cnpg.name" . }}
  labels:
    {{- include "schnappy.sonarqube.postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "schnappy.sonarqube.cnpg.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "schnappy.sonarqube.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "schnappy.sonarqube.cnpg.name" . }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "schnappy.sonarqube.cnpg.name" . }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    {{- if .Values.sonarqube.cnpg.import }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "schnappy.sonarqube.postgres.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.sonarqube.cnpg.backup }}
    - to:
        - ipBlock:
            cidr: 192.168.11.4/32
        - ipBlock:
            cidr: 192.168.11.5/32
        - ipBlock:
            cidr: 192.168.11.6/32
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
{{- end }}
{{- end }}
