{{- if and .Values.prometheus.enabled (eq (.Values.kubeStateMetrics.enabled | toString) "true") -}}
# Custom resources kube-state-metrics reports: CloudNativePG's Cluster status - its conditions (ContinuousArchiving,
# LastBackupSucceeded, ...: 1 True, 0 False) and its last successful and failed backups' end (Unix time; none failed:
# 0). Postgres' backups are CNPG's (no Job), and its pods' own metrics port is not scraped (meshed): the Postgres
# backup alerts read these. Read on the Vagrant copy with kube-state-metrics 2.18.0 and 2.20.0 (2026-10-09).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "schnappy.kubeStateMetrics.serviceName" . }}-custom-resources
  labels:
    {{- include "schnappy.kubeStateMetrics.labels" . | nindent 4 }}
data:
  custom-resources.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind: {group: postgresql.cnpg.io, version: v1, kind: Cluster}
          metricNamePrefix: cnpg_cluster
          labelsFromPath:
            namespace: [metadata, namespace]
            cluster: [metadata, name]
          metrics:
            - name: condition
              help: "A CloudNativePG Cluster's status condition: 1 True, 0 False"
              each:
                type: Gauge
                gauge:
                  path: [status, conditions]
                  labelsFromPath:
                    type: [type]
                  valueFrom: [status]
            - name: last_successful_backup_timestamp_seconds
              help: "When the Cluster's last successful backup ended"
              each:
                type: Gauge
                gauge:
                  path: [status, lastSuccessfulBackup]
            - name: last_failed_backup_timestamp_seconds
              help: "When the Cluster's last failed backup ended (0: none)"
              each:
                type: Gauge
                gauge:
                  path: [status, lastFailedBackup]
                  nilIsZero: true
{{- end }}
