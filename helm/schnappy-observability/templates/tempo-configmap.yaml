{{- if eq (.Values.tempo.enabled | toString) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "schnappy.fullname" . }}-tempo-config
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      # Default 4MB recv-size truncates trace batches under stress —
      # apps then retry, OkHttp times out at 10s, ERROR-spam in logs.
      grpc_server_max_recv_msg_size: 16777216
      grpc_server_max_send_msg_size: 16777216
      http_server_read_timeout: 30s
      http_server_write_timeout: 30s

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
              # HTTP receiver doesn't expose a body-size knob; use
              # server.http_server_read_timeout above for HTTP traffic.
              max_recv_msg_size_mib: 16
            http:
              endpoint: 0.0.0.0:4318
        zipkin:
          endpoint: 0.0.0.0:9411

    {{- /* the image's major version picks the config, so the image (infra) and this template (platform) may change in
           either order */}}
    {{- $major := regexFind "^[0-9]+" (last (splitList ":" .Values.tempo.image)) | default "2" | int }}
    {{- if ge $major 3 }}

    # Tempo 3 in monolithic mode (no Kafka): the in-process live-store replaces the ingester. Its WAL and shutdown
    # marker go on the data volume - the default /var/tempo is on the read-only root filesystem.
    live_store:
      shutdown_marker_dir: /data/live-store/shutdown-marker
      wal:
        path: /data/live-store/traces

    # The backend scheduler's local work cache on the data volume too: its default is /var/tempo, on the read-only
    # root - the scheduler cannot keep its work there, and no compaction or retention would run
    backend_scheduler:
      local_work_path: /data/backend-scheduler

    # Tempo 3: retention is the backend worker's (2.x: compactor.compaction)
    backend_worker:
      compaction:
        block_retention: {{ .Values.tempo.retention | default "336h" }}
    {{- else }}

    ingester:
      max_block_duration: 5m
      # stopped (any restart, its replacement by the next major, Tempo 3), all it holds written to the store first: Tempo 3
      # does not replay 2's WAL
      flush_all_on_shutdown: true

    compactor:
      compaction:
        block_retention: {{ .Values.tempo.retention | default "336h" }}
    {{- end }}

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /data/generator/wal
        remote_write:
          - url: http://{{ include "schnappy.fullname" . }}-mimir:9009/api/v1/push
            send_exemplars: true
      {{- if lt $major 3 }}
      traces_storage:
        path: /data/generator/traces
      {{- end }}

    storage:
      trace:
        backend: s3
        wal:
          path: /data/wal
        s3:
          bucket: tempo-traces
          endpoint: {{ .Values.tempo.minioEndpoint | default (printf "%s-minio.%s.svc:9000" (include "schnappy.fullname" .) .Release.Namespace) }}
          access_key: ${MINIO_ROOT_USER}
          secret_key: ${MINIO_ROOT_PASSWORD}
          insecure: true
          forcepathstyle: true

    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
{{- end }}
