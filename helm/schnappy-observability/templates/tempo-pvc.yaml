{{- if eq (.Values.tempo.enabled | toString) "true" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "schnappy.fullname" . }}-tempo
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
  annotations:
    # local-path's volume goes with its claim: Argo never prunes or deletes this one, whatever its application's policy
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.tempo.storageClassName }}
  storageClassName: {{ .Values.tempo.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.tempo.storage | default "2Gi" }}
{{- end }}
