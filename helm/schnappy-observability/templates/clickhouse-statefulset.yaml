{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "schnappy.clickhouse.serviceName" . }}
  labels:
    {{- include "schnappy.clickhouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "schnappy.clickhouse.serviceName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "schnappy.clickhouse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "schnappy.clickhouse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: schnappy
      # the server's config and users are subPath mounts, never updated in a running pod: a change restarts it (the
      # system logs' TTL, 2026-10-16, would otherwise wait for an unrelated restart). The schemas are the init Job's
      annotations:
        checksum/config: {{ print (.Files.Get "files/clickhouse-config.xml") (.Files.Get "files/clickhouse-users.xml") (include "schnappy.clickhouse.backupConfig" .) (ternary (.Files.Get "files/clickhouse-backup-user.xml") "" (eq (.Values.clickhouse.backup.enabled | toString) "true")) (ternary (.Files.Get "files/clickhouse-grafana-user.xml") "" (eq (.Values.clickhouse.grafanaUser | toString) "true")) | sha256sum }}
        {{- if eq (.Values.clickhouse.backup.enabled | toString) "true" }}
        # its backups go straight to the Pi store, past the sidecar (as production's CNPG pods' - barman through it
        # failed): the store's addresses only - a port excluded for every destination would skip the sidecar to any mesh
        # service on it, and STRICT would reset that connection
        traffic.sidecar.istio.io/excludeOutboundIPRanges: {{ .Values.clickhouse.backup.storeIps | join "/32," }}/32
        {{- end }}
    spec:
      # 30s is too short for ClickHouse to flush MergeTree parts/buffers cleanly.
      terminationGracePeriodSeconds: 120
      serviceAccountName: {{ include "schnappy.fullname" . }}-clickhouse
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ClickHouse expects users.xml to read CLICKHOUSE_PASSWORD_SHA256
        # from env. Compute it from CLICKHOUSE_PASSWORD here so the
        # ConfigMap stays static.
        - name: hash-password
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              # BusyBox sha256sum + awk are sufficient; no apk install
              # (init container runs as non-root, can't write apk db).
              echo -n "$CLICKHOUSE_PASSWORD" | sha256sum | awk '{print $1}' > /env/CLICKHOUSE_PASSWORD_SHA256
              {{- if (eq (.Values.clickhouse.grafanaUser | toString) "true") }}
              # Grafana's own user's (files/clickhouse-grafana-user.xml)
              echo -n "$GRAFANA_PASSWORD" | sha256sum | awk '{print $1}' > /env/CLICKHOUSE_GRAFANA_PASSWORD_SHA256
              {{- end }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.clickhouse.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            {{- if (eq (.Values.clickhouse.grafanaUser | toString) "true") }}
            - name: GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.clickhouse.secretName" . }}
                  key: GRAFANA_PASSWORD
            {{- end }}
          volumeMounts:
            - { name: env, mountPath: /env }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - { containerPort: 8123, name: http }
            - { containerPort: 9000, name: native }
            - { containerPort: 9363, name: metrics }
          env:
            # The image's entrypoint creates no user: users.d/00-users.xml has the one user, schnappy. With
            # CLICKHOUSE_USER=default it wrote users.d/default-user.xml - a `default` user with this password, from ::/0.
            # CLICKHOUSE_USER stays for the client in the container: a bare clickhouse-client logs in as schnappy.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
            - name: CLICKHOUSE_USER
              value: schnappy
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.clickhouse.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_PASSWORD_SHA256_FILE
              value: /env/CLICKHOUSE_PASSWORD_SHA256
            {{- if eq (.Values.clickhouse.backup.enabled | toString) "true" }}
            # the Pi store's keys, for backup.xml's named collection (clickhouse-backup.yaml's ExternalSecret)
            - name: BACKUP_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.clickhouse.serviceName" . }}-backup-store
                  key: ACCESS_KEY
            - name: BACKUP_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.clickhouse.serviceName" . }}-backup-store
                  key: SECRET_KEY
            {{- end }}
          # Source the SHA256 file as an env var so users.xml can read it.
          # ClickHouse's docker entrypoint exports anything in /docker-entrypoint-initdb.d
          # but env_file is simpler.
          command:
            - /bin/bash
            - -c
            - |
              export CLICKHOUSE_PASSWORD_SHA256="$(cat /env/CLICKHOUSE_PASSWORD_SHA256)"
              {{- if (eq (.Values.clickhouse.grafanaUser | toString) "true") }}
              export CLICKHOUSE_GRAFANA_PASSWORD_SHA256="$(cat /env/CLICKHOUSE_GRAFANA_PASSWORD_SHA256)"
              {{- end }}
              exec /entrypoint.sh
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/00-config.xml, subPath: config.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/00-users.xml, subPath: users.xml }
            {{- if (eq (.Values.clickhouse.grafanaUser | toString) "true") }}
            - { name: config, mountPath: /etc/clickhouse-server/users.d/60-grafana-user.xml, subPath: grafana-user.xml }
            {{- end }}
            {{- if eq (.Values.clickhouse.backup.enabled | toString) "true" }}
            - { name: config, mountPath: /etc/clickhouse-server/config.d/50-backup.xml, subPath: backup.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/50-backup-user.xml, subPath: backup-user.xml }
            {{- end }}
            - { name: env, mountPath: /env, readOnly: true }
          # a new release's first start loads every table's parts (53 GB on ten): 10 minutes before liveness counts
          startupProbe:
            httpGet: { path: /ping, port: 8123 }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false
      volumes:
        - name: config
          configMap:
            name: {{ include "schnappy.clickhouse.serviceName" . }}-config
        - name: env
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage.size }}
        {{- if .Values.clickhouse.storage.storageClass }}
        storageClassName: {{ .Values.clickhouse.storage.storageClass | quote }}
        {{- end }}
{{- end }}
