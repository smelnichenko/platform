{{- if .Values.clickhouse.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "schnappy.fullname" . }}-clickhouse
  labels:
    {{- include "schnappy.clickhouse.labels" . | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "schnappy.clickhouse.serviceName" . }}-init
  labels:
    {{- include "schnappy.clickhouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  # bounded: Argo waits for a hook until Kubernetes fails the Job - three tries of the 300 s wait and the schema
  activeDeadlineSeconds: 1200
  # no ttlSecondsAfterFinished: a success is deleted by its hook policy, a failure keeps its pod and log to the next sync
  template:
    metadata:
      labels:
        # not the server's selector labels: the Service would take this pod (no server in it) as an endpoint
        {{- include "schnappy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse-init
        job-component: clickhouse-init
        velero.io/exclude-from-backup: "true"
      annotations:
        # the proxy an init container of its own that runs first and stops with the Job (as kafka-backup's): no
        # quitquitquit call at the script's end, whose failure the Job had to ignore
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "schnappy.fullname" . }}-clickhouse
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: init
          image: {{ .Values.clickhouse.image }}
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "schnappy.clickhouse.secretName" . }}
                  key: CLICKHOUSE_PASSWORD
          command:
            - sh
            - -c
            - |
              set -eo pipefail
              HOST="{{ include "schnappy.clickhouse.serviceName" . }}"
              # Wait for server to accept queries - bounded by the clock (a client call itself may hang: its own timeout)
              end=$(( $(date +%s) + 300 ))
              for i in $(seq 1 1000); do
                if clickhouse-client --host "$HOST" --user schnappy --password "$CLICKHOUSE_PASSWORD" --connect_timeout 5 --receive_timeout 10 --query "SELECT 1" >/dev/null 2>&1; then break; fi
                [ "$(date +%s)" -lt "$end" ] || { echo "ClickHouse not answering after 300s"; exit 1; }
                sleep 2
              done

              cp /sql/logs-schema.sql /tmp/logs-schema.sql
              sed -i "s/__TTL_DAYS__/{{ .Values.clickhouse.retention.days | default 30 }}/g" /tmp/logs-schema.sql
              # --multiquery makes clickhouse-client execute every
              # ;-separated statement in the file. Failures abort.
              clickhouse-client --host "$HOST" --user schnappy --password "$CLICKHOUSE_PASSWORD" --connect_timeout 5 --receive_timeout 300 --multiquery < /tmp/logs-schema.sql

              {{- if eq (.Values.clickhouse.events.enabled | toString) "true" }}
              cp /sql/events-schema.sql /tmp/events-schema.sql
              sed -i \
                -e "s/__KAFKA_BROKERS__/{{ .Values.clickhouse.events.kafka.bootstrapServers }}/g" \
                -e "s/__KAFKA_TOPICS__/{{ .Values.clickhouse.events.kafka.topics | join "," }}/g" \
                -e "s/__KAFKA_GROUP__/{{ .Values.clickhouse.events.kafka.consumerGroup }}/g" \
                -e "s/__KAFKA_NUM_CONS__/{{ .Values.clickhouse.events.kafka.numConsumers | default 2 }}/g" \
                -e "s/__EVT_TTL_DAYS__/{{ .Values.clickhouse.events.retentionDays | default 180 }}/g" \
                /tmp/events-schema.sql
              clickhouse-client --host "$HOST" --user schnappy --password "$CLICKHOUSE_PASSWORD" --connect_timeout 5 --receive_timeout 300 --multiquery < /tmp/events-schema.sql
              {{- end }}
          volumeMounts:
            - { name: sql, mountPath: /sql, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: sql
          configMap:
            name: {{ include "schnappy.clickhouse.serviceName" . }}-config
            items:
              - { key: logs-schema.sql, path: logs-schema.sql }
              {{- if eq (.Values.clickhouse.events.enabled | toString) "true" }}
              - { key: events-schema.sql, path: events-schema.sql }
              {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
