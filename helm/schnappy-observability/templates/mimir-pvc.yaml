{{- if eq (.Values.mimir.enabled | toString) "true" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "schnappy.fullname" . }}-mimir
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
    app.kubernetes.io/component: mimir
  annotations:
    # its application prunes, and local-path's volume goes with its claim: Argo never prunes or deletes this one
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.mimir.storageClassName }}
  storageClassName: {{ .Values.mimir.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mimir.storage | default "5Gi" }}
{{- end }}
