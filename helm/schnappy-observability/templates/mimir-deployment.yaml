{{- if eq (.Values.mimir.enabled | toString) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "schnappy.fullname" . }}-mimir
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
    app.kubernetes.io/component: mimir
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "schnappy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mimir
  template:
    metadata:
      labels:
        {{- include "schnappy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mimir
        app.kubernetes.io/part-of: schnappy
      annotations:
        sidecar.istio.io/inject: "false"
        checksum/config: {{ include (print $.Template.BasePath "/mimir-configmap.yaml") . | sha256sum }}
        backup.velero.io/backup-volumes: data
    spec:
      serviceAccountName: {{ include "schnappy.fullname" . }}-mimir
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-dirs
          image: busybox:1.37
          command: ['sh', '-c', 'mkdir -p /data/ruler-configs /data/ruler-data']
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: mimir
          image: {{ .Values.mimir.image }}
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
            - -target=all
          ports:
            - containerPort: 9009
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mimir.minioSecret | default "schnappy-minio" }}
                  key: {{ .Values.mimir.accessKeyName | default "MINIO_ROOT_USER" }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mimir.minioSecret | default "schnappy-minio" }}
                  key: {{ .Values.mimir.secretKeyName | default "MINIO_ROOT_PASSWORD" }}
          resources:
            {{- toYaml .Values.mimir.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # Start-up (WAL replay, ring join) gets up to 5 min before the liveness probe counts: with liveness alone
          # (30 s delay, 3 x 10 s) a start on a busy node was killed before /ready and every restart began again
          # (2026-10-01, a crash loop after a mass restart).
          startupProbe:
            httpGet:
              path: /ready
              port: 9009
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ready
              port: 9009
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: {{ include "schnappy.fullname" . }}-mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "schnappy.fullname" . }}-mimir
        - name: tmp
          emptyDir: {}
{{- end }}
