{{- if eq (.Values.smartctl.enabled | toString) "true" }}
# smartctl_exporter runs on the host (systemd unit, installed by ops
# setup-host-hardening.yml) bound to {{ .Values.smartctl.host }}:{{ .Values.smartctl.port }}.
#
# We use ScrapeConfig (CRD) instead of Service+EndpointSlice+ServiceMonitor
# because Argo's default resource.exclusions strips both Endpoints and
# EndpointSlice (treating them as kubelet-managed). ScrapeConfig is a
# direct static_configs path that bypasses K8s Service discovery
# entirely — exactly what's needed for a fixed-IP host-level target.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: {{ include "schnappy.fullname" . }}-smartctl-exporter
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
    app.kubernetes.io/component: smartctl-exporter
    # Prometheus operator's scrapeConfigSelector matches release=schnappy
    # (set on the Prometheus CR in clusters/production/prometheus/values.yaml).
    # Without this label, our ScrapeConfig is invisible to the operator.
    release: schnappy
spec:
  staticConfigs:
    - targets:
        - {{ printf "%s:%d" .Values.smartctl.host (int .Values.smartctl.port) | quote }}
      labels:
        job: smartctl-exporter
        instance: ten
  scrapeInterval: 60s
  scrapeTimeout: 30s
{{- if eq (.Values.networkPolicies.enabled | toString) "true" }}
---
# schnappy-infra has a default-deny NetworkPolicy. Without an explicit
# allow rule, Prometheus' scrape of {{ .Values.smartctl.host }}:{{ .Values.smartctl.port }}
# hits "context deadline exceeded". Selecting Prometheus by the operator's
# canonical label ("app.kubernetes.io/name=prometheus") matches the
# StatefulSet pod regardless of release name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "schnappy.fullname" . }}-prometheus-egress-smartctl
  labels:
    {{- include "schnappy.labels" . | nindent 4 }}
    app.kubernetes.io/component: smartctl-exporter
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.smartctl.host }}/32
      ports:
        - port: {{ .Values.smartctl.port }}
          protocol: TCP
{{- end }}
{{- end }}
