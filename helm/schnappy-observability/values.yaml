# Monitoring and logging chart
nameOverride: schnappy

vault:
  secretsEnabled: false
  secretPathPrefix: "secret/data/schnappy"

networkPolicies:
  enabled: true

gateway:
  enabled: false
  name: ""
  namespace: ""
  hosts:
    grafana: ""
    logs: ""
    reports: ""
    # Browsable Prometheus. Also set kube-prometheus-stack's prometheusSpec.externalUrl to it:
    # that is what alert emails link to, and the in-cluster default is unreachable from a mail client.
    prometheus: ""
  # Service kube-prometheus-stack created (its fullnameOverride decides the name); required with hosts.prometheus.
  prometheusService: ""

# ClickHouse — log storage backend; replaces ELK in steady state.
# Both backends can be on simultaneously during cutover.
clickhouse:
  enabled: false
  image: clickhouse/clickhouse-server:26.8.15.10-alpine
  password: ""
  existingSecret: ""
  resources:
    requests: { cpu: "100m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "2Gi" }
  storage:
    size: 20Gi
    storageClass: ""
  retention:
    days: 30
  # Grafana plugin install — toggled here so a single chart value
  # controls both the datasource emit and the plugin presence.
  installGrafanaPlugin: true
  # the plugin's version, pinned: unversioned, each Grafana kept the newest of its first start (production 4.22.0, a
  # copy built later 4.22.1 - read 2026-10-09). A changed pin is installed over the one there at the next start.
  grafanaPluginVersion: "4.22.0"
  # Realtime envelope archive: events database fed by Kafka, gives
  # analytics + replay over the same publication stream Centrifugo
  # fans out. Enable in tandem with the schnappy-realtime chart.
  events:
    enabled: false
    retentionDays: 180
    kafka:
      bootstrapServers: "schnappy-kafka-bootstrap:9092"
      consumerGroup: "clickhouse-events"
      numConsumers: 2
      topics:
        - events.chat.messages
        - events.chess.moves
        - events.notifications

# OpenObserve — Discover-like UI for ad-hoc log exploration.
# Fluent-bit log shipper.
fluentbit:
  enabled: false
  image: cr.fluentbit.io/fluent/fluent-bit:4.2.3.1
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "200m" }
  # tail's positions and the filesystem buffer in this directory on the node's disk: a roll resumes where the last pod
  # stopped and sends the chunks it left. Empty: an emptyDir, both go with the pod (a roll starts at the files' ends)
  stateHostPath: ""
  # tries of a chunk for ClickHouse before it is dropped; no_limits: it waits however long ClickHouse is down
  retryLimit: "5"
  # the filesystem buffer for ClickHouse bounded on disk (e.g. 512M; past it the oldest chunks go). Empty: unbounded
  bufferLimit: ""
  # a file found at the start without a position (a container started, a log rotated while Fluent Bit was down) read
  # from its start. Needs stateHostPath: with the positions gone with the pod every file would ship again
  readFromHead: false

# Prometheus (scraping via ServiceMonitors, deployed separately via kube-prometheus-stack)
prometheus:
  enabled: false
  scrapeInterval: 15s
  # URLs on hosts in schnappy-mesh gatewayLanOnly; probed from a pod, each must return 403.
  lanOnlyProbeUrls: []
  woodpecker:
    enabled: false
  forgejo:
    enabled: false

# Grafana Mimir (long-term metrics storage via MinIO S3)
mimir:
  enabled: false
  image: grafana/mimir:2.17.8
  retention: 90d
  minioSecret: schnappy-minio
  resources:
    requests: { memory: "512Mi", cpu: "200m" }
    limits: { memory: "2Gi", cpu: "2000m" }
  storage: 5Gi
  storageClassName: ""
  # more flags for Mimir, after the config file's (none in production; the Vagrant upgrade copy shortens the querier's
  # windows, so its old samples are read from the stored blocks)
  extraArgs: []

# Grafana Tempo (distributed tracing)
tempo:
  enabled: false
  image: grafana/tempo:2.7.2
  retention: 336h
  minioSecret: schnappy-minio
  # Single-replica (PVC for WAL is RWO local-path). Stress 11 (with
  # JDK sender finally honoring the 30s timeout) showed Tempo
  # genuinely takes >30s for some peak-burst batches at 2 CPU.
  # Bumping to 4 CPU since the host has headroom.
  resources:
    requests: { memory: 512Mi, cpu: 200m }
    limits: { memory: 3Gi, cpu: 4000m }
  storage: 2Gi
  storageClassName: ""

# Alertmanager
alertmanager:
  enabled: false
  image: prom/alertmanager:v0.34.1
  alertEmailTo: ""
  alertEmailFrom: "alerts@pmon.dev"
  kagentInvestigate:
    # Critical alerts fan out to kagent's alert2agent for an LLM investigation. OFF: it has no per-incident cap, and one
    # incident (nine criticals, 2026-09-15) spent the whole API balance in four minutes. The human e-mail route is unaffected.
    enabled: false
  smtp:
    host: smtp.resend.com
    port: "587"
    username: resend
  webhookSecret: ""
  existingSecret: ""
  groupWait: 30s
  groupInterval: 5m
  repeatInterval: 4h
  resources:
    requests: { memory: "128Mi", cpu: "25m" }
    limits: { memory: "256Mi", cpu: "200m" }
  storage:
    size: 1Gi
    storageClass: ""

# kube-state-metrics
kubeStateMetrics:
  enabled: false
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
  resources:
    requests: { memory: "64Mi", cpu: "25m" }
    limits: { memory: "256Mi", cpu: "200m" }

# Pushgateway — persistent metric sink for the manually-triggered DR drill
# (`task dr:drill` pushes restore_verify_success). Off by default; enabled in prod.
pushgateway:
  enabled: false
  image: quay.io/prometheus/pushgateway:v1.11.3
  storage: 16Mi
  storageClass: local-path
  resources:
    requests: { memory: "32Mi", cpu: "10m" }
    limits: { memory: "128Mi", cpu: "100m" }

# Grafana
grafana:
  enabled: false
  image: grafana/grafana:12.4.2
  # pluginsPreinstallAutoUpdate: false - GF_PLUGINS_PREINSTALL_AUTO_UPDATE when set (unset: Grafana's own default).
  # Grafana 13 on this chart's read-only root filesystem needs false (grafana-deployment.yaml says why).
  adminUser: admin
  adminPassword: ""
  existingSecret: ""
  resources:
    requests: { memory: "128Mi", cpu: "100m" }
    limits: { memory: "256Mi", cpu: "500m" }
  storage:
    size: 1Gi
    storageClass: ""
  service:
    type: ClusterIP
    port: 3000
  # Extra in-cluster namespaces allowed to reach Grafana :3000 (API consumers like
  # kagent's grafana-mcp). A values list so this generic chart doesn't name its
  # consumers — mirrors schnappy-mesh's gateway.allowedNamespaces idiom.
  extraIngressNamespaces: []
  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""
      clusterIssuer: "letsencrypt-prod"
  oauth:
    enabled: false
    name: "Forgejo"
    authUrl: ""
    tokenUrl: ""
    apiUrl: ""
    scopes: "openid profile email"
    autoLogin: false

# Hyperfoil report server (Nginx → MinIO proxy)
reports:
  enabled: false
  image: nginx:1.28.3-alpine
  ingress:
    enabled: false
    host: reports.local
    tls:
      enabled: false
      clusterIssuer: letsencrypt-dns
      secretName: ""

# Runbooks server (Nginx serving bundled .md files from chart)
# The runbook_url annotation on each alert points at this service; on-call
# can open it from an alert email without logging into Forgejo.
runbooks:
  enabled: false
  image: nginx:1.27-alpine

# smartctl_exporter — drive SMART metrics for NVMe / SATA monitoring.
# Exporter runs on the host (systemd unit, installed by ops
# setup-host-hardening.yml). Chart only emits the cluster-side
# scrape glue (Service+Endpoints+ServiceMonitor) + alert rules.
smartctl:
  enabled: false
  host: "192.168.11.2"
  port: 9633

# Cross-chart references
app:
  service:
    port: 8080
