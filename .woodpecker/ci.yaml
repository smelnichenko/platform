# CI: Lint Helm chart on push

# ONE run per change: the pull request's. Listing `push` as well fired a second pipeline - first for
# every push to a branch with an open PR (two identical runs on the same sha), then, once that was
# narrowed to main, for the merge commit as well. Nothing lands here without a PR, so the PR run is
# the gate; the merge commit carries the same tree that just passed it.
when:
  - event: pull_request
  # AND the merge commit on main. Not a duplicate: the pull_request run tests the PR's own head, and two
  # PRs that were each green apart can still break main together. This repo has no other gate - Argo
  # applies main to the live cluster - so the tree that actually lands is checked here.
  - event: push
    branch: main

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 100

steps:
  - name: helm-lint
    image: alpine/helm:latest
    commands:
      # the render checks read a policy as YAML (alpine/helm ships neither)
      # bash and iconv (musl-utils) for the backups' scripts (kafka-backup-test.sh runs the dump and restore as the
      # CronJob's image does)
      - apk add --no-cache python3 py3-yaml bash musl-utils
      - helm lint helm/schnappy/ --set site.dnsResolver=10.43.0.10
      - helm lint helm/schnappy-data/ --set postgres.password=test
      - helm lint helm/schnappy-auth/
      - helm lint helm/schnappy-observability/
      - helm lint helm/schnappy-sonarqube/
      - helm lint helm/schnappy-mesh/
      # Lint renders defaults, where the gateway routes and the LAN-only policy are off.
      - sh .woodpecker/chart-render-checks.sh
      # the render checks' own checkers (mesh-selectors.py, velero-volumes.py) against fixtures: today's charts are right, a
      # checker broken to pass everything would stay green on them alone
      - sh .woodpecker/mesh-checkers-test.sh
      # the sonarqube setup hook's script, as rendered, against a stub SonarQube and Vault
      - sh .woodpecker/sonarqube-setup-script-test.sh
      # the Scylla schema, gateway patch and preview cleanup hooks' scripts, as rendered, against stub tools
      - sh .woodpecker/hook-scripts-test.sh
      # ClickHouse's backup: the prune's script against a stub rclone (the newest complete ones kept, a listing failing
      # removes nothing), the server's backup config as rendered
      - sh .woodpecker/clickhouse-backup-prune-test.sh
      # Kafka's backup: its dump against stub Kafka tools (exact counts, a short read red), its CronJob as rendered, the
      # prune script the same in both charts
      - bash .woodpecker/kafka-backup-test.sh
      - helm lint helm/schnappy-realtime/
      # smokeTest is off by default; without the flag nothing renders.
      - helm lint helm/schnappy-test/ --set smokeTest.enabled=true
      # The k6 smoke script ships in both charts and must not drift.
      - cmp helm/schnappy/files/smoke-test.js helm/schnappy-test/files/smoke-test.js
      # An alert's runbook_url must land on a page, not on the index.
      - sh .woodpecker/runbooks-exist.sh

  # CNPG's backups as production renders them: a daily schedule in CNPG's six-field cron, a bounded store
  - name: cnpg-backup-render
    image: alpine/helm:latest
    commands:
      - sh .woodpecker/cnpg-backup-render.sh
      - sh .woodpecker/cnpg-databases-render.sh

  # ClickHouse started on the chart's config in the chart's image: a config it refuses fails here, not at production's
  # restart; every system log it keeps has a TTL (the script says why)
  - name: clickhouse-config-start
    image: clickhouse/clickhouse-server:26.8.39.19-alpine
    environment:
      CI_STEP_IMAGE_CHECK: clickhouse/clickhouse-server:26.8.39.19-alpine
    commands:
      - sh .woodpecker/clickhouse-config-start.sh

  # masi's allow-list and its documentation (docs/masi-allowed-hosts.md) name the same hosts: a host added or removed on
  # one side only fails here
  - name: masi-allowed-hosts-doc
    image: alpine/helm:latest
    commands:
      - sh .woodpecker/allowed-hosts-doc.sh

  # Alert rules are code: promtool checks the syntax and runs the unit tests under
  # helm/schnappy/tests/rules/ against the rules rendered as production sees them, in the
  # Prometheus image the cluster runs (kube-prometheus-stack, pinned in infra's argocd/apps/prometheus.yaml: v3.15.0
  # live on 2026-10-18 - move this tag with that chart).
  - name: render-rules
    image: alpine/helm:latest
    commands:
      - sh .woodpecker/render-rules.sh
  - name: rules-unit-tests
    image: quay.io/prometheus/prometheus:v3.15.0
    depends_on: [render-rules]
    commands:
      - sh .woodpecker/rules-unit-tests.sh

  # Alertmanager's config in Alertmanager's own image (the one infra's values run: values.yaml's alertmanager.image -
  # move this tag with it): amtool takes it, each alert's route as production's, and the upgrade cycle's notices through
  # Alertmanager itself - a config it refuses fails here, not by crash-looping production's pod with no alert going out
  - name: alertmanager-render
    image: alpine/helm:latest
    commands:
      - sh .woodpecker/alertmanager-render.sh
  - name: alertmanager-check
    image: prom/alertmanager:v0.34.2
    depends_on: [alertmanager-render]
    commands:
      - sh .woodpecker/alertmanager-check.sh

  # The init-users hook script against a real Postgres: what "Succeeded" must
  # mean (roles, ownership, quoted passwords, idempotent rotation, abort on a
  # missing secret or an SQL error). A stub psql cannot see that -c strings are
  # not variable-interpolated; this did.
  - name: init-users-script
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: test
    commands:
      - sh .woodpecker/init-users-script-test.sh
    depends_on: [helm-lint]

  - name: sonar
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    commands:
      # A pull request analyses into its OWN project (schnappy-platform-pr): SonarQube CE has no branch analysis, and one
      # project for both judged a pull request by main's new code (one issue on main failed every PR - Renovate's units
      # too) and showed whoever pushed last (2026-11-16, as masi since 2026-09-20). Main keeps waiting for its gate.
      # A missing token fails the gate: one that skips itself green is a gate nobody enforces.
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "SONAR_TOKEN or SONAR_HOST_URL is missing: the quality gate cannot be checked"; exit 1; }'
      - |
        if [ "$CI_PIPELINE_EVENT" = pull_request ]; then
          sonar-scanner -Dsonar.projectKey=schnappy-platform-pr -Dsonar.projectName='Schnappy Platform (pull requests)' -Dsonar.qualitygate.wait=true
        else
          sonar-scanner -Dsonar.qualitygate.wait=true
        fi
    depends_on: [helm-lint]
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
