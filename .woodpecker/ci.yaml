# CI: Lint Helm chart on push

when:
  - event: push
  - event: pull_request

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 100

steps:
  - name: helm-lint
    image: alpine/helm:latest
    commands:
      - helm lint helm/schnappy/ --set site.dnsResolver=10.43.0.10
      - helm lint helm/schnappy-data/ --set postgres.password=test
      - helm lint helm/schnappy-auth/
      - helm lint helm/schnappy-observability/
      - helm lint helm/schnappy-sonarqube/
      - helm lint helm/schnappy-mesh/
      # Lint renders defaults, where the gateway routes and the LAN-only policy are off.
      - sh .woodpecker/chart-render-checks.sh
      - helm lint helm/schnappy-realtime/
      # smokeTest is off by default; without the flag nothing renders.
      - helm lint helm/schnappy-test/ --set smokeTest.enabled=true
      # The k6 smoke script ships in both charts and must not drift.
      - cmp helm/schnappy/files/smoke-test.js helm/schnappy-test/files/smoke-test.js

  # The init-users hook script against a real Postgres: what "Succeeded" must
  # mean (roles, ownership, quoted passwords, idempotent rotation, abort on a
  # missing secret or an SQL error). A stub psql cannot see that -c strings are
  # not variable-interpolated; this did.
  - name: init-users-script
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: test
    commands:
      - sh .woodpecker/init-users-script-test.sh
    depends_on: [helm-lint]

  - name: sonar
    image: git.pmon.dev/schnappy/sonar-scanner:latest
    commands:
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "Skipping SonarQube (no token or URL)"; exit 0; }'
      - sonar-scanner -Dsonar.qualitygate.wait=true
    depends_on: [helm-lint]
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL

services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test
